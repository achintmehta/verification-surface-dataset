<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Kanban Board</h1>
      <span class="connection-status" id="connection-status" title="SSE connection status">
        <span class="dot"></span>
        <span class="label">Connecting…</span>
      </span>
    </header>

    <main class="board" id="board">
      <!-- Columns are rendered dynamically -->
      <div class="board-loading" id="board-loading">Loading board…</div>
    </main>

    <!-- Card creation dialog -->
    <dialog id="new-card-dialog" class="dialog">
      <form id="new-card-form" method="dialog">
        <h2>New Card</h2>
        <label for="card-text">Card text</label>
        <textarea
          id="card-text"
          name="text"
          rows="3"
          placeholder="What needs to be done?"
          required
          maxlength="500"
        ></textarea>
        <div class="dialog-actions">
          <button type="button" id="dialog-cancel">Cancel</button>
          <button type="submit" id="dialog-submit">Add Card</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
