<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board</title>
  <script type="module" crossorigin src="/assets/index-D9T9ICbp.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BXf7dU-b.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <span class="header-logo">&#9776;</span>
      <h1 class="header-title">Kanban Board</h1>
      <span class="header-badge" id="connection-badge">connecting…</span>
    </div>
  </header>

  <main class="board-container">
    <div class="board" id="board">
      <!-- columns rendered by JS -->
    </div>
  </main>

  <!-- Card creation modal -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 class="modal-title" id="modal-title">New Card</h2>
      <textarea
        id="card-text-input"
        class="modal-textarea"
        placeholder="What needs to be done?"
        rows="4"
        maxlength="500"
      ></textarea>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-submit">Add Card</button>
      </div>
    </div>
  </div>

</body>
</html>
