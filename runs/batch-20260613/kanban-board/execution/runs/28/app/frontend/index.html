<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <h1>Kanban Board</h1>
    <div id="board" class="board"></div>
    <div class="add-card">
      <input type="text" id="new-card-text" placeholder="New card text">
      <select id="new-card-column">
        <option value="col-todo">To Do</option>
        <option value="col-progress">In Progress</option>
        <option value="col-done">Done</option>
      </select>
      <button id="add-card-btn">Add Card</button>
    </div>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
