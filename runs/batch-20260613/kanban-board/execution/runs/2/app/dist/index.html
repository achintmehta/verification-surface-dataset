<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board</title>
    <script type="module" crossorigin src="/assets/index-B3m0_N_z.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DGg-IWuC.css">
  </head>
  <body>
    <header class="app-header">
      <h1>Kanban Board</h1>
      <span class="connection-status" id="connection-status" title="SSE connection status">●</span>
    </header>

    <main id="board" class="board">
      <!-- Columns are rendered dynamically -->
    </main>

    <!-- Card creation modal -->
    <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal">
        <h2 id="modal-title">New Card</h2>
        <textarea
          id="card-text-input"
          class="card-text-input"
          placeholder="What needs to be done?"
          rows="3"
          maxlength="500"
        ></textarea>
        <div class="modal-actions">
          <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
          <button id="modal-submit" class="btn btn-primary">Add Card</button>
        </div>
      </div>
    </div>

  </body>
</html>
