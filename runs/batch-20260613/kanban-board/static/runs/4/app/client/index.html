<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">
      <span class="app-title-icon">📋</span>
      Kanban Board
    </h1>
    <div class="header-status">
      <span id="connection-indicator" class="connection-dot disconnected" title="SSE connection status"></span>
      <span id="connection-label" class="connection-label">Connecting…</span>
    </div>
  </header>

  <main class="board-container">
    <div id="board" class="board" role="main" aria-label="Kanban board">
      <!-- Columns are rendered here by JavaScript -->
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
