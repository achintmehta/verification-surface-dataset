<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Kanban Board</h1>
      <span class="connection-status" id="connection-status" title="SSE connection status">●</span>
    </header>

    <main id="board" class="board" role="main" aria-label="Kanban board">
      <!-- Columns are rendered dynamically by board.js -->
      <div class="board-loading" id="board-loading">Loading board…</div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
