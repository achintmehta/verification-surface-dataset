<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Kanban Board</h1>
      <span class="connection-status" id="connection-status" title="SSE connection status">●</span>
    </header>

    <main class="board" id="board">
      <!-- Columns are rendered dynamically -->
      <div class="board-loading" id="board-loading">Loading board…</div>
    </main>

    <!-- Card creation modal -->
    <div class="modal-overlay" id="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">Add Card</h2>
        <form id="card-form">
          <input type="hidden" id="card-column-id" />
          <label for="card-text">Card text</label>
          <textarea
            id="card-text"
            rows="3"
            placeholder="What needs to be done?"
            required
            maxlength="500"
          ></textarea>
          <div class="modal-actions">
            <button type="submit" class="btn btn-primary">Add Card</button>
            <button type="button" class="btn btn-secondary" id="modal-cancel">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
