<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>📋 Kanban Board</h1>
      <span class="connection-status" id="connection-status">⚪ Connecting…</span>
    </header>

    <main class="board" id="board">
      <div class="board-loading" id="board-loading">Loading board…</div>
    </main>

    <!-- Card creation modal -->
    <div class="modal-overlay" id="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">New Card</h2>
        <textarea
          id="card-text-input"
          placeholder="What needs to be done?"
          rows="4"
          maxlength="500"
        ></textarea>
        <div class="modal-actions">
          <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
          <button id="modal-submit" class="btn btn-primary">Add Card</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
