<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Board</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Kanban Board</h1>
    <span class="connection-status" id="connection-status" title="SSE connection status">●</span>
  </header>

  <main id="board" class="board" aria-label="Kanban board">
    <div class="board-loading" id="board-loading">Loading board…</div>
  </main>

  <!-- Card-creation modal -->
  <dialog id="card-modal" aria-labelledby="modal-title">
    <form id="card-form" method="dialog">
      <h2 id="modal-title">New Card</h2>
      <label for="card-text">Card text</label>
      <textarea id="card-text" rows="3" placeholder="What needs to be done?" required></textarea>
      <div class="modal-actions">
        <button type="submit" class="btn btn-primary">Add Card</button>
        <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
