<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Explorer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-left">
        <h1 class="logo">📋 Log Explorer</h1>
        <span class="row-count" id="row-count">Loading…</span>
      </div>
      <div class="header-right">
        <div class="filter-group">
          <label for="severity-filter">Severity</label>
          <select id="severity-filter">
            <option value="">All</option>
            <option value="debug">Debug</option>
            <option value="info">Info</option>
            <option value="warn">Warn</option>
            <option value="error">Error</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="search-input">Search</label>
          <input
            type="text"
            id="search-input"
            placeholder="Filter by message…"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </div>
    </header>

    <div class="table-header">
      <div class="col-ts">Timestamp</div>
      <div class="col-sev">Severity</div>
      <div class="col-svc">Service</div>
      <div class="col-msg">Message</div>
    </div>

    <div class="scroller-wrap" id="scroller-wrap">
      <div class="scroller" id="scroller">
        <!-- virtual spacer -->
        <div class="spacer" id="spacer"></div>
        <!-- row pool rendered here -->
        <div class="row-pool" id="row-pool"></div>
      </div>
    </div>

    <div class="status-bar" id="status-bar">
      <span id="status-text">Initializing…</span>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
