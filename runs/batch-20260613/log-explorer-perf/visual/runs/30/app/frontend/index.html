<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Explorer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    .container { max-width: 1200px; margin: 0 auto; }
    .filters { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
    .filters select, .filters input { padding: 8px; font-size: 14px; }
    .stats { margin-bottom: 10px; font-size: 14px; color: #555; }
    .virtual-table { border: 1px solid #ddd; background: white; position: relative; height: 600px; overflow: auto; }
    .table-header { display: flex; background: #f0f0f0; font-weight: bold; position: sticky; top: 0; z-index: 1; }
    .table-header > div { padding: 10px; border-right: 1px solid #ddd; }
    .table-row { display: flex; border-bottom: 1px solid #eee; position: absolute; left: 0; right: 0; }
    .table-row > div { padding: 8px 10px; border-right: 1px solid #ddd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .severity-debug { color: #666; }
    .severity-info { color: #0066cc; }
    .severity-warn { color: #cc8800; }
    .severity-error { color: #cc0000; font-weight: bold; }
    .timestamp { font-family: monospace; width: 180px; }
    .severity { width: 80px; }
    .service { width: 120px; }
    .message { flex: 1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Log Explorer</h1>
    <div class="filters">
      <select id="severity-filter">
        <option value="">All Severities</option>
        <option value="debug">Debug</option>
        <option value="info">Info</option>
        <option value="warn">Warn</option>
        <option value="error">Error</option>
      </select>
      <input type="text" id="search-input" placeholder="Search message..." style="width: 300px;">
      <div class="stats" id="stats">Loading...</div>
    </div>
    <div id="row-count" style="margin-bottom: 10px; font-size: 14px;"></div>
    <div class="virtual-table" id="virtual-table">
      <div class="table-header">
        <div class="timestamp" style="width:180px">Timestamp</div>
        <div class="severity" style="width:80px">Severity</div>
        <div class="service" style="width:120px">Service</div>
        <div class="message" style="flex:1">Message</div>
      </div>
      <div id="scroll-container" style="position: relative; height: 100%;"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
