<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Explorer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Log Explorer</h1>
      <div class="filters">
        <select id="severity-filter">
          <option value="">All Severities</option>
          <option value="debug">Debug</option>
          <option value="info">Info</option>
          <option value="warn">Warn</option>
          <option value="error">Error</option>
        </select>
        <input type="text" id="search-input" placeholder="Search messages...">
        <div class="stats">
          <span id="filtered-count">0</span> of <span id="total-count">0</span> logs
          (<span id="debug-count" class="badge debug">0</span>
          <span id="info-count" class="badge info">0</span>
          <span id="warn-count" class="badge warn">0</span>
          <span id="error-count" class="badge error">0</span>)
        </div>
      </div>
    </header>
    <main>
      <div class="table-header">
        <div class="col-ts">Timestamp</div>
        <div class="col-severity">Severity</div>
        <div class="col-service">Service</div>
        <div class="col-message">Message</div>
      </div>
      <div id="viewport">
        <div id="spacer"></div>
        <div id="rows-container"></div>
      </div>
    </main>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
