<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Explorer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f5f5f5;
    }
    header {
      background-color: #fff;
      padding: 16px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .stats {
      margin-left: auto;
      font-size: 14px;
      color: #666;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 4px;
    }
    .badge.debug { background-color: #e0e0e0; color: #333; }
    .badge.info { background-color: #e3f2fd; color: #0d47a1; }
    .badge.warn { background-color: #fff3e0; color: #e65100; }
    .badge.error { background-color: #ffebee; color: #b71c1c; }
    
    .row-severity.debug { color: #757575; }
    .row-severity.info { color: #1976d2; }
    .row-severity.warn { color: #f57c00; }
    .row-severity.error { color: #d32f2f; font-weight: bold; }

    #viewport {
      flex: 1;
      overflow-y: auto;
      position: relative;
      background-color: #fff;
    }
    #spacer {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
    }
    #content {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
    }
    .log-row {
      display: flex;
      padding: 8px 16px;
      border-bottom: 1px solid #eee;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 13px;
      white-space: pre;
    }
    .log-row > div {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .col-ts { width: 180px; flex-shrink: 0; color: #888; }
    .col-sev { width: 60px; flex-shrink: 0; }
    .col-svc { width: 150px; flex-shrink: 0; color: #555; }
    .col-msg { flex: 1; }
    
    input, select {
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h2>Log Explorer</h2>
    <select id="severity-filter">
      <option value="">All Severities</option>
      <option value="debug">Debug</option>
      <option value="info">Info</option>
      <option value="warn">Warn</option>
      <option value="error">Error</option>
    </select>
    <input type="text" id="search-input" placeholder="Search messages..." />
    <div class="stats" id="stats-container">
      Loading stats...
    </div>
  </header>
  <div id="viewport">
    <div id="spacer"></div>
    <div id="content"></div>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
