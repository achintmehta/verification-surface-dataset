<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Explorer</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <h1>Log Explorer</h1>
          <p>100k deterministic rows · server-windowed · virtualized DOM</p>
        </div>
        <div id="status" class="status">Starting…</div>
      </header>

      <section class="filters" aria-label="Log filters">
        <label>
          Severity
          <select id="severity">
            <option value="">All severities</option>
            <option value="debug">Debug (~60%)</option>
            <option value="info">Info (~25%)</option>
            <option value="warn">Warn (~10%)</option>
            <option value="error">Error (~5%)</option>
          </select>
        </label>
        <label class="search-label">
          Message contains
          <input id="search" type="search" placeholder="Try: timeout, redis, request, failed…" autocomplete="off" />
        </label>
        <div id="badges" class="badges"></div>
      </section>

      <main class="panel">
        <div class="table-head" role="row">
          <div>Timestamp</div>
          <div>Severity</div>
          <div>Service</div>
          <div>Message</div>
        </div>
        <div id="scroller" class="scroller" tabindex="0" aria-label="Virtualized log rows">
          <div id="spacer" class="spacer"></div>
          <div id="rows" class="rows"></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
