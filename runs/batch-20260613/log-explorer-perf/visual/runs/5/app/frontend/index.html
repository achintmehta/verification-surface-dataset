<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Explorer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-left">
        <h1>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          Log Explorer
        </h1>
        <span id="row-count" class="row-count">Loading…</span>
      </div>
      <div class="header-right">
        <div class="filter-group">
          <label for="severity-filter">Severity</label>
          <select id="severity-filter">
            <option value="">All levels</option>
            <option value="debug">Debug</option>
            <option value="info">Info</option>
            <option value="warn">Warn</option>
            <option value="error">Error</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="search-input">Search</label>
          <div class="search-wrapper">
            <span class="search-icon">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </span>
            <input
              type="text"
              id="search-input"
              placeholder="Filter by message…"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
        </div>
      </div>
    </header>

    <div class="table-header">
      <div class="col-ts">Timestamp</div>
      <div class="col-severity">Severity</div>
      <div class="col-service">Service</div>
      <div class="col-message">Message</div>
    </div>

    <div id="scroll-container" class="scroll-container">
      <div id="scroll-spacer" class="scroll-spacer"></div>
      <div id="rows-container" class="rows-container"></div>
      <div id="empty-state" class="empty-state" style="display:none">
        <div class="empty-state-icon">🔍</div>
        <div class="empty-state-text">No matching logs</div>
        <div class="empty-state-sub">Try adjusting your filters</div>
      </div>
    </div>

    <div class="status-bar">
      <span id="status-text">Initializing…</span>
      <span class="status-right" id="offset-indicator"></span>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
