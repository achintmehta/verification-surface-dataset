<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Explorer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Log Explorer</h1>
      <div class="controls">
        <select id="severity" aria-label="Severity filter">
          <option value="">All severities</option>
          <option value="debug">debug</option>
          <option value="info">info</option>
          <option value="warn">warn</option>
          <option value="error">error</option>
        </select>
        <input
          id="search"
          type="text"
          placeholder="Search messages…"
          autocomplete="off"
          spellcheck="false"
        />
        <span id="count" class="count">0 of 0</span>
      </div>
    </header>

    <div class="table-head">
      <div class="col col-ts">Timestamp</div>
      <div class="col col-sev">Severity</div>
      <div class="col col-svc">Service</div>
      <div class="col col-msg">Message</div>
    </div>

    <div id="viewport" class="viewport">
      <div id="spacer" class="spacer">
        <div id="rows" class="rows"></div>
      </div>
      <div id="empty" class="empty" hidden>No matching log entries.</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
