<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Explorer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; }
    .header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
    .filters { display: flex; gap: 12px; align-items: center; }
    select, input { padding: 8px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    .stats { display: flex; gap: 8px; font-size: 13px; }
    .badge { padding: 2px 8px; border-radius: 12px; background: #e9ecef; }
    .log-table-container { 
      position: relative; 
      height: 600px; 
      overflow-y: auto; 
      border: 1px solid #dee2e6; 
      background: white;
      font-family: ui-monospace, monospace;
      font-size: 13px;
    }
    .virtual-spacer { position: relative; }
    .log-row { 
      display: flex; 
      padding: 6px 12px; 
      border-bottom: 1px solid #f1f3f5; 
      align-items: center;
      height: 32px;
      box-sizing: border-box;
    }
    .log-row:hover { background: #f8f9fa; }
    .col-ts { width: 180px; color: #495057; flex-shrink: 0; }
    .col-sev { width: 70px; flex-shrink: 0; font-weight: 600; }
    .col-svc { width: 100px; color: #6c757d; flex-shrink: 0; }
    .col-msg { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .severity-debug { color: #6c757d; }
    .severity-info { color: #0d6efd; }
    .severity-warn { color: #fd7e14; }
    .severity-error { color: #dc3545; }
    .row-count { margin-top: 8px; font-size: 13px; color: #6c757d; }
    .loading { padding: 20px; text-align: center; color: #6c757d; }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <h1 style="margin:0; font-size:24px;">Log Explorer</h1>
      <div class="filters">
        <select id="severity-filter">
          <option value="">All Severities</option>
          <option value="debug">Debug</option>
          <option value="info">Info</option>
          <option value="warn">Warn</option>
          <option value="error">Error</option>
        </select>
        <input type="text" id="search-input" placeholder="Search message..." style="width: 280px;">
      </div>
      <div class="stats" id="stats-bar"></div>
    </div>
    
    <div id="table-container" class="log-table-container">
      <div id="virtual-spacer" class="virtual-spacer">
        <div id="visible-rows"></div>
      </div>
    </div>
    
    <div class="row-count" id="row-count">0 of 0 rows</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
