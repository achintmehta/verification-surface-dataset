<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Explorer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="toolbar">
      <h1>Log Explorer</h1>
      <div class="controls">
        <label>
          Severity
          <select id="severity">
            <option value="">all</option>
            <option value="debug">debug</option>
            <option value="info">info</option>
            <option value="warn">warn</option>
            <option value="error">error</option>
          </select>
        </label>
        <label class="search">
          Search
          <input id="search" type="text" placeholder="substring in message…" autocomplete="off" />
        </label>
        <span id="count" class="count">— of —</span>
      </div>
      <div id="badges" class="badges"></div>
    </header>

    <div id="table" class="table">
      <div class="thead">
        <div class="col-ts">timestamp</div>
        <div class="col-sev">severity</div>
        <div class="col-svc">service</div>
        <div class="col-msg">message</div>
      </div>
      <div id="viewport" class="viewport">
        <div id="spacer" class="spacer">
          <div id="rows" class="rows"></div>
        </div>
      </div>
      <div id="status" class="status"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
