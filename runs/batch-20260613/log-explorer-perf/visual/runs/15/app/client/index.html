<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Explorer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <h1>Log Explorer</h1>
        <div class="controls">
          <label class="field">
            <span>Severity</span>
            <select id="severity">
              <option value="">All</option>
              <option value="debug">debug</option>
              <option value="info">info</option>
              <option value="warn">warn</option>
              <option value="error">error</option>
            </select>
          </label>
          <label class="field grow">
            <span>Search message</span>
            <input id="search" type="text" placeholder="e.g. timeout, orders, refund…" autocomplete="off" />
          </label>
          <div class="count" id="count">— of —</div>
        </div>
        <div class="badges" id="badges"></div>
      </header>

      <div class="table">
        <div class="thead">
          <div class="col col-ts">Timestamp</div>
          <div class="col col-sev">Severity</div>
          <div class="col col-svc">Service</div>
          <div class="col col-msg">Message</div>
        </div>
        <div class="viewport" id="viewport">
          <div class="spacer" id="spacer">
            <div class="rows" id="rows"></div>
          </div>
        </div>
      </div>
      <div class="status" id="status"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
