<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Explorer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; }
    .header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
    .filters { display: flex; gap: 10px; align-items: center; }
    select, input { padding: 8px; font-size: 14px; }
    .stats { margin-left: auto; font-size: 14px; color: #555; }
    .virtual-container {
      height: 600px;
      overflow-y: auto;
      border: 1px solid #ddd;
      background: white;
      position: relative;
    }
    .virtual-inner {
      position: relative;
    }
    .log-row {
      position: absolute;
      left: 0;
      right: 0;
      height: 32px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      border-bottom: 1px solid #eee;
      font-size: 13px;
      font-family: ui-monospace, monospace;
    }
    .log-row:hover { background: #f0f4f8; }
    .col-ts { width: 180px; flex-shrink: 0; }
    .col-sev { width: 70px; flex-shrink: 0; font-weight: 600; }
    .col-svc { width: 110px; flex-shrink: 0; }
    .col-msg { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sev-debug { color: #6b7280; }
    .sev-info { color: #2563eb; }
    .sev-warn { color: #d97706; }
    .sev-error { color: #dc2626; }
    .loading { padding: 20px; text-align: center; color: #666; }
    .empty { padding: 40px; text-align: center; color: #999; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Log Explorer</h1>
    <div class="filters">
      <select id="severity-filter">
        <option value="">All Severities</option>
        <option value="debug">Debug</option>
        <option value="info">Info</option>
        <option value="warn">Warn</option>
        <option value="error">Error</option>
      </select>
      <input type="text" id="search-input" placeholder="Search message..." style="width: 300px;">
    </div>
    <div class="stats">
      <span id="row-count">0 of 0</span>
    </div>
  </div>

  <div id="virtual-container" class="virtual-container">
    <div id="virtual-inner" class="virtual-inner"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
