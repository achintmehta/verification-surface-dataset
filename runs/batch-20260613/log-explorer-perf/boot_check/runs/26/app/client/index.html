<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Explorer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; }
    .header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
    .filters { display: flex; gap: 10px; align-items: center; }
    select, input { padding: 8px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    .stats { display: flex; gap: 8px; margin-left: auto; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    .debug { background: #e5e7eb; color: #374151; }
    .info { background: #dbeafe; color: #1e40af; }
    .warn { background: #fef3c7; color: #92400e; }
    .error { background: #fee2e2; color: #991b1b; }
    .table-container { 
      height: 600px; 
      overflow-y: auto; 
      border: 1px solid #ddd; 
      background: white; 
      position: relative;
      font-size: 13px;
    }
    .virtual-inner {
      position: relative;
    }
    .log-row {
      position: absolute;
      left: 0;
      right: 0;
      height: 28px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #f0f0f0;
      padding: 0 10px;
      box-sizing: border-box;
    }
    .log-row:hover { background: #f8f9fa; }
    .col-ts { width: 180px; font-family: monospace; color: #666; }
    .col-sev { width: 70px; font-weight: 600; }
    .col-svc { width: 160px; color: #555; }
    .col-msg { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-count { margin-top: 8px; color: #666; font-size: 13px; }
    .loading { color: #999; }
  </style>
</head>
<body>
  <div id="app">
    <h1>Log Explorer</h1>
    <div class="header">
      <div class="filters">
        <select id="severity-filter">
          <option value="">All Severities</option>
          <option value="debug">Debug</option>
          <option value="info">Info</option>
          <option value="warn">Warn</option>
          <option value="error">Error</option>
        </select>
        <input type="text" id="search-input" placeholder="Search message..." style="width: 300px;">
      </div>
      <div class="stats" id="stats-badges"></div>
    </div>
    <div class="row-count" id="row-count"></div>
    <div id="table-container" class="table-container">
      <div id="virtual-inner" class="virtual-inner"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
