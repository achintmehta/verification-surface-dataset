<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Explorer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    .controls { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
    select, input { padding: 8px; font-size: 14px; }
    .table-container { position: relative; height: 600px; overflow: auto; background: white; border: 1px solid #ddd; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    th { background: #f0f0f0; position: sticky; top: 0; z-index: 1; }
    .debug { color: #666; }
    .info { color: #0066cc; }
    .warn { color: #cc8800; }
    .error { color: #cc0000; font-weight: bold; }
    .row-count { margin-left: auto; font-size: 14px; color: #555; }
    .virtual-spacer { height: 0; }
  </style>
</head>
<body>
  <div id="app">
    <h1>Log Explorer</h1>
    <div class="controls">
      <select id="severity-filter">
        <option value="">All Severities</option>
        <option value="debug">Debug</option>
        <option value="info">Info</option>
        <option value="warn">Warn</option>
        <option value="error">Error</option>
      </select>
      <input type="text" id="search-input" placeholder="Search message..." style="width: 300px;">
      <div class="row-count" id="row-count">0 of 0</div>
    </div>
    <div class="table-container" id="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 180px;">Timestamp</th>
            <th style="width: 80px;">Severity</th>
            <th style="width: 120px;">Service</th>
            <th>Message</th>
          </tr>
        </thead>
        <tbody id="log-tbody"></tbody>
      </table>
      <div id="virtual-spacer" style="height: 0;"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
