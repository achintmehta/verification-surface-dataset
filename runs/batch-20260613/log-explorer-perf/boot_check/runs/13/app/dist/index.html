<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Explorer</title>
    <script type="module" crossorigin src="/assets/index-D4HMQlt_.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-COw-eN1j.css">
  </head>
  <body>
    <header class="toolbar">
      <h1>Log Explorer</h1>
      <div class="filters">
        <label>
          Severity
          <select id="severity">
            <option value="">all</option>
            <option value="debug">debug</option>
            <option value="info">info</option>
            <option value="warn">warn</option>
            <option value="error">error</option>
          </select>
        </label>
        <label class="search">
          Search
          <input id="q" type="text" placeholder="substring in message…" autocomplete="off" />
        </label>
        <span id="counts" class="counts"></span>
      </div>
    </header>

    <div id="grid" class="grid">
      <div class="grid-header">
        <div class="col-ts">Timestamp</div>
        <div class="col-sev">Severity</div>
        <div class="col-svc">Service</div>
        <div class="col-msg">Message</div>
      </div>
      <div id="viewport" class="viewport">
        <div id="spacer" class="spacer">
          <div id="rows" class="rows"></div>
        </div>
      </div>
    </div>

  </body>
</html>
