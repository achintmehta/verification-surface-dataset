<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Explorer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .filters { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
    .filters select, .filters input { padding: 8px; font-size: 14px; }
    .stats { margin-bottom: 10px; font-size: 14px; color: #555; }
    .virtual-table { position: relative; height: 600px; overflow: auto; background: white; border: 1px solid #ddd; }
    .virtual-scroller { position: relative; }
    .log-row { display: flex; border-bottom: 1px solid #eee; font-size: 13px; height: 32px; align-items: center; padding: 0 10px; }
    .log-row:hover { background: #f9f9f9; }
    .log-row > div { padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .col-ts { width: 180px; flex-shrink: 0; }
    .col-severity { width: 80px; flex-shrink: 0; font-weight: bold; }
    .col-service { width: 120px; flex-shrink: 0; }
    .col-message { flex: 1; }
    .severity-debug { color: #6b7280; }
    .severity-info { color: #2563eb; }
    .severity-warn { color: #d97706; }
    .severity-error { color: #dc2626; }
    .row-count { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Log Explorer</h1>
    <div class="filters">
      <select id="severity-filter">
        <option value="">All Severities</option>
        <option value="debug">Debug</option>
        <option value="info">Info</option>
        <option value="warn">Warn</option>
        <option value="error">Error</option>
      </select>
      <input type="text" id="search-input" placeholder="Search message..." style="width: 300px;">
      <div class="row-count" id="row-count"></div>
    </div>
    <div class="stats" id="stats"></div>
    <div id="virtual-table" class="virtual-table">
      <div id="virtual-scroller" class="virtual-scroller"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
