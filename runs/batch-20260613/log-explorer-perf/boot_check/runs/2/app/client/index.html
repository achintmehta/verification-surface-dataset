<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Explorer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-left">
        <h1>Log Explorer</h1>
        <span id="row-count" class="row-count">Loading...</span>
      </div>
      <div class="header-controls">
        <div class="filter-group">
          <label for="severity-select">Severity</label>
          <select id="severity-select">
            <option value="">All</option>
            <option value="error">Error</option>
            <option value="warn">Warn</option>
            <option value="info">Info</option>
            <option value="debug">Debug</option>
          </select>
        </div>
        <div class="filter-group">
          <div id="severity-badges" class="severity-badges"></div>
        </div>
        <div class="filter-group">
          <label for="search-input">Search</label>
          <input
            id="search-input"
            type="text"
            placeholder="Filter by message..."
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </div>
    </header>

    <div class="table-container">
      <div class="table-header">
        <div class="col-ts">Timestamp</div>
        <div class="col-severity">Severity</div>
        <div class="col-service">Service</div>
        <div class="col-message">Message</div>
      </div>
      <!--
        Virtual scroller layout:
          .virtual-scroller  — scrollable viewport
            .scroll-spacer   — height = total * ROW_HEIGHT (sets scroll range)
              .rows-container — absolutely positioned, translated to current window
      -->
      <div id="virtual-scroller" class="virtual-scroller">
        <div id="scroll-spacer" class="scroll-spacer">
          <div id="rows-container" class="rows-container"></div>
        </div>
      </div>
    </div>

    <div id="status-bar" class="status-bar">
      <span id="status-text">Connecting...</span>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
