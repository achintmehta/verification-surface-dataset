<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Explorer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; }
    .header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
    .filters { display: flex; gap: 10px; align-items: center; }
    select, input { padding: 8px; font-size: 14px; }
    .stats { font-size: 14px; color: #555; }
    .virtual-table { border: 1px solid #ddd; background: white; position: relative; height: 600px; overflow-y: auto; }
    .virtual-scroller { position: relative; }
    .log-row { display: flex; border-bottom: 1px solid #eee; font-size: 13px; height: 32px; align-items: center; padding: 0 10px; box-sizing: border-box; }
    .log-row:hover { background: #f0f8ff; }
    .col-ts { width: 180px; font-family: monospace; }
    .col-sev { width: 70px; font-weight: bold; }
    .col-service { width: 120px; }
    .col-msg { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .debug { color: #6c757d; }
    .info { color: #0d6efd; }
    .warn { color: #fd7e14; }
    .error { color: #dc3545; }
    .row-count { margin-top: 10px; font-size: 14px; }
    .loading { padding: 20px; text-align: center; color: #666; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Log Explorer</h1>
    <div class="filters">
      <select id="severity-filter">
        <option value="">All Severities</option>
        <option value="debug">Debug</option>
        <option value="info">Info</option>
        <option value="warn">Warn</option>
        <option value="error">Error</option>
      </select>
      <input type="text" id="search-input" placeholder="Search message..." style="width: 300px;">
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div id="table-container" class="virtual-table">
    <div id="virtual-scroller" class="virtual-scroller"></div>
  </div>
  <div class="row-count" id="row-count"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
