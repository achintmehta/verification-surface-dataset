<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Explorer</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <h1>Log Explorer</h1>
      </div>
      <div class="header-stats" id="header-stats">
        <span class="stat-badge" id="stat-total">Loading...</span>
      </div>
    </header>

    <div class="toolbar">
      <div class="filter-group">
        <label for="severity-filter">Severity</label>
        <select id="severity-filter">
          <option value="">All</option>
          <option value="error">Error</option>
          <option value="warn">Warn</option>
          <option value="info">Info</option>
          <option value="debug">Debug</option>
        </select>
      </div>

      <div class="filter-group search-group">
        <label for="search-input">Search</label>
        <div class="search-wrapper">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input
            type="text"
            id="search-input"
            placeholder="Filter by message..."
            autocomplete="off"
            spellcheck="false"
          />
          <button id="search-clear" class="search-clear" title="Clear search" style="display:none">×</button>
        </div>
      </div>

      <div class="filter-group severity-badges" id="severity-badges">
        <!-- Populated by JS -->
      </div>

      <div class="result-count" id="result-count">
        <!-- Populated by JS -->
      </div>
    </div>

    <div class="table-container">
      <div class="table-header">
        <div class="col-ts">Timestamp</div>
        <div class="col-severity">Level</div>
        <div class="col-service">Service</div>
        <div class="col-message">Message</div>
      </div>

      <div class="virtual-scroll-container" id="scroll-container">
        <!-- spacer sets total scrollable height -->
        <div class="virtual-scroll-spacer" id="scroll-spacer"></div>
        <!-- rows container is sticky so it stays in view; rows inside are absolutely positioned -->
        <div class="virtual-rows" id="virtual-rows"></div>
      </div>

      <div class="empty-state" id="empty-state" style="display:none">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <p>No log entries match your filters</p>
      </div>

      <div class="loading-overlay" id="loading-overlay" style="display:none">
        <div class="spinner"></div>
        <span>Loading...</span>
      </div>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
