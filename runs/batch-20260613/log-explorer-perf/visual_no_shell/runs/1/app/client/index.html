<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Explorer</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <h1>Log Explorer</h1>
      </div>
      <div class="header-controls">
        <div class="filter-group">
          <label for="severity-filter">Severity</label>
          <select id="severity-filter">
            <option value="">All</option>
            <option value="debug">Debug</option>
            <option value="info">Info</option>
            <option value="warn">Warn</option>
            <option value="error">Error</option>
          </select>
        </div>
        <div class="filter-group search-group">
          <label for="search-input">Search</label>
          <div class="search-wrapper">
            <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input
              type="text"
              id="search-input"
              placeholder="Filter by message..."
              autocomplete="off"
              spellcheck="false"
            />
            <button id="search-clear" class="search-clear" aria-label="Clear search" style="display:none">×</button>
          </div>
        </div>
        <div class="stats-badge" id="stats-badge">
          <span id="row-count">—</span>
          <span class="stats-label">rows</span>
        </div>
      </div>
    </header>

    <div class="severity-bar" id="severity-bar">
      <button class="sev-btn active" data-severity="">
        All <span class="sev-count" id="count-all">—</span>
      </button>
      <button class="sev-btn debug" data-severity="debug">
        Debug <span class="sev-count" id="count-debug">—</span>
      </button>
      <button class="sev-btn info" data-severity="info">
        Info <span class="sev-count" id="count-info">—</span>
      </button>
      <button class="sev-btn warn" data-severity="warn">
        Warn <span class="sev-count" id="count-warn">—</span>
      </button>
      <button class="sev-btn error" data-severity="error">
        Error <span class="sev-count" id="count-error">—</span>
      </button>
    </div>

    <div class="table-header">
      <div class="col-ts">Timestamp</div>
      <div class="col-sev">Severity</div>
      <div class="col-svc">Service</div>
      <div class="col-msg">Message</div>
    </div>

    <div class="scroll-container" id="scroll-container">
      <div class="scroll-spacer" id="scroll-spacer"></div>
      <div class="rows-viewport" id="rows-viewport"></div>
    </div>

    <div class="status-bar" id="status-bar">
      <span id="status-text">Loading...</span>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
