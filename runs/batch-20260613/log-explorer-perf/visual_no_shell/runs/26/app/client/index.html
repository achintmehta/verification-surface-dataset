<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Explorer</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Log Explorer</h1>
      <div class="filters">
        <select id="severity-filter">
          <option value="">All Severities</option>
          <option value="debug">Debug</option>
          <option value="info">Info</option>
          <option value="warn">Warn</option>
          <option value="error">Error</option>
        </select>
        <input type="text" id="search-input" placeholder="Search messages...">
        <div id="row-count">0 of 0</div>
      </div>
    </header>
    <div id="virtual-table-container">
      <div class="table-header">
        <div class="col ts">Timestamp</div>
        <div class="col sev">Severity</div>
        <div class="col svc">Service</div>
        <div class="col msg">Message</div>
      </div>
      <div id="virtual-scroller">
        <div id="log-rows" class="rows-container"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
