<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Explorer</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background-color: #f5f5f5;
      }
      header {
        background-color: #fff;
        padding: 16px;
        border-bottom: 1px solid #ddd;
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .filter-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      input, select {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      .stats {
        margin-left: auto;
        font-size: 14px;
        color: #666;
      }
      .log-container {
        flex: 1;
        overflow: auto;
        position: relative;
        background-color: #fff;
      }
      .log-scroll-content {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
      }
      .log-row {
        position: absolute;
        left: 0;
        right: 0;
        height: 30px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        border-bottom: 1px solid #eee;
        box-sizing: border-box;
        font-family: monospace;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .log-row:hover {
        background-color: #f9f9f9;
      }
      .col-ts { width: 200px; flex-shrink: 0; color: #666; }
      .col-severity { width: 80px; flex-shrink: 0; font-weight: bold; }
      .col-service { width: 120px; flex-shrink: 0; color: #0066cc; }
      .col-message { flex: 1; overflow: hidden; text-overflow: ellipsis; }
      
      .sev-debug { color: #888; }
      .sev-info { color: #0066cc; }
      .sev-warn { color: #cc8800; }
      .sev-error { color: #cc0000; }
    </style>
  </head>
  <body>
    <header>
      <div class="filter-group">
        <label for="severity">Severity:</label>
        <select id="severity">
          <option value="">All</option>
          <option value="debug">Debug</option>
          <option value="info">Info</option>
          <option value="warn">Warn</option>
          <option value="error">Error</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="search">Search:</label>
        <input type="text" id="search" placeholder="Search messages..." />
      </div>
      <div class="stats" id="stats">
        Loading...
      </div>
    </header>
    <div class="log-container" id="log-container">
      <div class="log-scroll-content" id="log-scroll-content"></div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
