<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Explorer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .header {
      padding: 16px 20px;
      background: #1a1a2e;
      color: white;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
    }
    .filters {
      padding: 16px 20px;
      background: #fafafa;
      border-bottom: 1px solid #eee;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .filters select, .filters input {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }
    .filters input {
      flex: 1;
      max-width: 300px;
    }
    .row-count {
      margin-left: auto;
      color: #666;
      font-size: 14px;
    }
    .virtual-table {
      position: relative;
      height: 600px;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .virtual-scroller {
      position: relative;
    }
    .log-row {
      display: flex;
      padding: 8px 20px;
      border-bottom: 1px solid #eee;
      font-size: 13px;
      font-family: 'Monaco', 'Menlo', monospace;
      align-items: flex-start;
    }
    .log-row:hover {
      background: #f8f9fa;
    }
    .log-ts {
      width: 180px;
      color: #666;
      flex-shrink: 0;
    }
    .log-severity {
      width: 70px;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 3px;
      text-align: center;
      flex-shrink: 0;
    }
    .severity-debug { background: #e3f2fd; color: #1976d2; }
    .severity-info { background: #e8f5e9; color: #388e3c; }
    .severity-warn { background: #fff3e0; color: #f57c00; }
    .severity-error { background: #ffebee; color: #d32f2f; }
    .log-service {
      width: 120px;
      color: #555;
      flex-shrink: 0;
    }
    .log-message {
      flex: 1;
      word-break: break-word;
    }
    .loading {
      padding: 40px;
      text-align: center;
      color: #666;
    }
    .empty {
      padding: 40px;
      text-align: center;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Log Explorer</h1>
      <div style="margin-left: auto; font-size: 12px; opacity: 0.7;">100,000 log entries</div>
    </div>
    
    <div class="filters">
      <select id="severity-filter">
        <option value="">All Severities</option>
        <option value="debug">Debug</option>
        <option value="info">Info</option>
        <option value="warn">Warn</option>
        <option value="error">Error</option>
      </select>
      <input type="text" id="search-input" placeholder="Search in messages...">
      <div class="row-count" id="row-count">0 of 0</div>
    </div>
    
    <div class="virtual-table" id="virtual-table">
      <div class="virtual-scroller" id="virtual-scroller">
        <!-- rows injected here -->
      </div>
    </div>
  </div>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
