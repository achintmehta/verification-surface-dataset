<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Explorer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Log Explorer</h1>
      <div class="filters">
        <label class="filter">
          <span>Severity</span>
          <select id="severity">
            <option value="">All</option>
            <option value="debug">debug</option>
            <option value="info">info</option>
            <option value="warn">warn</option>
            <option value="error">error</option>
          </select>
        </label>
        <label class="filter search">
          <span>Search message</span>
          <input id="search" type="text" placeholder="substring, e.g. request or ERR_1042" autocomplete="off" />
        </label>
        <div class="count" id="count">0 of 0</div>
      </div>
      <div class="badges" id="badges"></div>
    </header>

    <div class="table-head">
      <div class="col col-ts">Timestamp</div>
      <div class="col col-sev">Severity</div>
      <div class="col col-svc">Service</div>
      <div class="col col-msg">Message</div>
    </div>

    <div id="scroller" class="scroller">
      <div id="spacer" class="spacer"></div>
      <div id="viewport" class="viewport"></div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
