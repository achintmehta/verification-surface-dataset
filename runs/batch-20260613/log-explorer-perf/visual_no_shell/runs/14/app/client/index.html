<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Explorer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="brand">
          <span class="logo">▚</span>
          <h1>Log Explorer</h1>
        </div>
        <div class="controls">
          <label class="control">
            <span>Severity</span>
            <select id="severity">
              <option value="">All</option>
              <option value="debug">debug</option>
              <option value="info">info</option>
              <option value="warn">warn</option>
              <option value="error">error</option>
            </select>
          </label>
          <label class="control search">
            <span>Search message</span>
            <input id="search" type="text" placeholder="e.g. declined, TXN, timeout…" autocomplete="off" />
          </label>
        </div>
        <div class="counts" id="counts">
          <span id="rowcount">– of –</span>
        </div>
      </header>

      <div class="table-head">
        <div class="col col-ts">Timestamp</div>
        <div class="col col-sev">Severity</div>
        <div class="col col-svc">Service</div>
        <div class="col col-msg">Message</div>
      </div>

      <div id="scroller" class="scroller">
        <div id="sizer" class="sizer"></div>
        <div id="viewport" class="viewport"></div>
        <div id="empty" class="empty" hidden>No log entries match the current filters.</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
