<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Explorer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <h1>Log Explorer</h1>
      <div class="filters">
        <div class="filter-group">
          <label for="severity-select">Severity</label>
          <select id="severity-select">
            <option value="">All</option>
            <option value="debug">Debug</option>
            <option value="info">Info</option>
            <option value="warn">Warn</option>
            <option value="error">Error</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="search-input">Search</label>
          <input type="text" id="search-input" placeholder="Search messages…" autocomplete="off" />
        </div>
      </div>
      <div class="stats">
        <span id="row-count">Loading…</span>
        <span id="severity-badges"></span>
      </div>
    </header>

    <div class="table-header">
      <div class="th col-ts">Timestamp</div>
      <div class="th col-severity">Severity</div>
      <div class="th col-service">Service</div>
      <div class="th col-message">Message</div>
    </div>

    <div id="virtual-container" class="virtual-container">
      <div id="virtual-spacer" class="virtual-spacer"></div>
      <div id="virtual-content" class="virtual-content"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
