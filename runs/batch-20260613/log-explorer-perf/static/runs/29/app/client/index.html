<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Explorer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #333;
    }
    .header {
      background: #1a1a2e;
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
    }
    .filters {
      background: white;
      padding: 16px 24px;
      border-bottom: 1px solid #ddd;
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    select, input {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .stats {
      margin-left: auto;
      font-size: 14px;
      color: #666;
    }
    .table-container {
      height: calc(100vh - 140px);
      overflow: hidden;
      position: relative;
      background: white;
    }
    .virtual-scroller {
      height: 100%;
      overflow-y: auto;
      position: relative;
    }
    .virtual-content {
      position: relative;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th {
      position: sticky;
      top: 0;
      background: #f8f9fa;
      z-index: 10;
      text-align: left;
      padding: 12px 16px;
      border-bottom: 2px solid #ddd;
      font-weight: 600;
      font-size: 13px;
      color: #555;
    }
    td {
      padding: 10px 16px;
      border-bottom: 1px solid #eee;
      font-size: 13px;
      vertical-align: top;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row {
      display: table-row;
    }
    .severity {
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      display: inline-block;
      min-width: 50px;
      text-align: center;
    }
    .severity-debug { background: #e3f2fd; color: #1565c0; }
    .severity-info { background: #e8f5e9; color: #2e7d32; }
    .severity-warn { background: #fff3e0; color: #ef6c00; }
    .severity-error { background: #ffebee; color: #c62828; }
    .timestamp {
      font-family: monospace;
      color: #666;
      font-size: 12px;
    }
    .service {
      font-weight: 500;
      color: #37474f;
    }
    .message {
      font-family: monospace;
      white-space: normal;
      line-height: 1.4;
    }
    .loading {
      padding: 40px;
      text-align: center;
      color: #888;
    }
    .empty {
      padding: 60px 20px;
      text-align: center;
      color: #888;
    }
    .row-count {
      font-size: 13px;
      color: #666;
      padding: 8px 24px;
      background: #fafafa;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Log Explorer</h1>
    <div id="status"></div>
  </div>

  <div class="filters">
    <div class="filter-group">
      <label for="severity">Severity:</label>
      <select id="severity">
        <option value="">All</option>
        <option value="debug">Debug</option>
        <option value="info">Info</option>
        <option value="warn">Warn</option>
        <option value="error">Error</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="search">Search:</label>
      <input type="text" id="search" placeholder="Search messages..." style="width: 300px;">
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="table-container">
    <div id="scroller" class="virtual-scroller">
      <div id="virtual-content" class="virtual-content">
        <table>
          <thead>
            <tr>
              <th style="width: 180px;">Timestamp</th>
              <th style="width: 80px;">Severity</th>
              <th style="width: 100px;">Service</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody id="tbody">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="row-count" id="row-count"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
