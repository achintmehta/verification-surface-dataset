<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Explorer</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <h1 class="title">Log Explorer</h1>
        <div class="filters">
          <label class="field">
            <span>Severity</span>
            <select id="severity">
              <option value="">All</option>
              <option value="debug">debug</option>
              <option value="info">info</option>
              <option value="warn">warn</option>
              <option value="error">error</option>
            </select>
          </label>
          <label class="field grow">
            <span>Search message</span>
            <input id="search" type="text" placeholder="substring (case-insensitive)…" autocomplete="off" />
          </label>
        </div>
        <div id="badges" class="badges"></div>
        <div id="rowcount" class="rowcount">—</div>
      </header>

      <div class="table-head">
        <span class="col col-ts">Timestamp</span>
        <span class="col col-sev">Severity</span>
        <span class="col col-svc">Service</span>
        <span class="col col-msg">Message</span>
      </div>

      <!-- The scroll container. Its inner spacer is sized to the full filtered
           height; only the visible window of rows is materialized inside. -->
      <div id="viewport" class="viewport">
        <div id="spacer" class="spacer">
          <div id="rows" class="rows"></div>
        </div>
      </div>

      <div id="status" class="status"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
