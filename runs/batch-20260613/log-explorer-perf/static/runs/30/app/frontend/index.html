<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Explorer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .filters {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      align-items: center;
    }
    .filters select, .filters input {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .filters input {
      width: 300px;
    }
    .row-count {
      color: #666;
      font-size: 14px;
    }
    .virtual-scroller {
      height: 600px;
      overflow-y: auto;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      position: relative;
    }
    .virtual-content {
      position: relative;
    }
    .log-row {
      display: flex;
      padding: 8px 12px;
      border-bottom: 1px solid #eee;
      font-size: 13px;
      font-family: 'Monaco', 'Menlo', monospace;
      align-items: flex-start;
    }
    .log-row:hover {
      background: #f8f9fa;
    }
    .log-ts {
      width: 180px;
      color: #666;
      flex-shrink: 0;
    }
    .log-severity {
      width: 70px;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      text-align: center;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .severity-debug { background: #e3f2fd; color: #1976d2; }
    .severity-info { background: #e8f5e9; color: #388e3c; }
    .severity-warn { background: #fff3e0; color: #f57c00; }
    .severity-error { background: #ffebee; color: #d32f2f; }
    .log-service {
      width: 90px;
      color: #555;
      flex-shrink: 0;
    }
    .log-message {
      flex: 1;
      word-break: break-word;
    }
    .loading {
      padding: 40px;
      text-align: center;
      color: #666;
    }
    .stats {
      display: flex;
      gap: 16px;
      font-size: 13px;
    }
    .stat-badge {
      padding: 4px 8px;
      border-radius: 12px;
      background: #eee;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Log Explorer</h1>
      <div class="stats" id="stats"></div>
    </div>
    
    <div class="filters">
      <select id="severity-filter">
        <option value="">All Severities</option>
        <option value="debug">Debug</option>
        <option value="info">Info</option>
        <option value="warn">Warn</option>
        <option value="error">Error</option>
      </select>
      <input type="text" id="search-input" placeholder="Search in messages...">
      <div class="row-count" id="row-count"></div>
    </div>

    <div class="virtual-scroller" id="scroller">
      <div class="virtual-content" id="virtual-content">
        <!-- rows will be inserted here -->
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
