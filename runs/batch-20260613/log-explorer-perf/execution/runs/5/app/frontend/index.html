<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Explorer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-left">
        <h1>📋 Log Explorer</h1>
        <span id="row-count" class="row-count">Loading…</span>
      </div>
      <div class="header-right">
        <div class="filter-bar">
          <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Search messages…"
              autocomplete="off"
              spellcheck="false"
            />
            <button id="search-clear" class="search-clear" title="Clear search" hidden>✕</button>
          </div>
          <select id="severity-select" class="severity-select">
            <option value="">All severities</option>
            <option value="debug">Debug</option>
            <option value="info">Info</option>
            <option value="warn">Warn</option>
            <option value="error">Error</option>
          </select>
        </div>
      </div>
    </header>

    <div class="table-container">
      <div class="table-header">
        <div class="col-ts">Timestamp</div>
        <div class="col-severity">Level</div>
        <div class="col-service">Service</div>
        <div class="col-message">Message</div>
      </div>

      <div id="scroll-container" class="scroll-container">
        <div id="scroll-spacer" class="scroll-spacer"></div>
        <div id="rows-container" class="rows-container"></div>
      </div>
    </div>

    <div id="status-bar" class="status-bar">
      <span id="status-text">Initializing…</span>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
