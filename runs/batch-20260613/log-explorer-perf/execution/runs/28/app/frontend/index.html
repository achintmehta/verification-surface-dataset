<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Explorer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    .controls { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
    select, input { padding: 8px; font-size: 14px; }
    .stats { margin-bottom: 10px; font-size: 14px; color: #555; }
    .virtual-container {
      height: 600px;
      overflow-y: auto;
      border: 1px solid #ddd;
      background: white;
      position: relative;
    }
    .virtual-inner {
      position: relative;
    }
    .log-row {
      position: absolute;
      left: 0;
      right: 0;
      height: 32px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding: 0 10px;
      font-size: 13px;
      box-sizing: border-box;
    }
    .log-row:hover { background: #f9f9f9; }
    .col-ts { width: 180px; font-family: monospace; }
    .col-sev { width: 70px; font-weight: bold; }
    .col-svc { width: 100px; }
    .col-msg { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sev-debug { color: #666; }
    .sev-info { color: #0066cc; }
    .sev-warn { color: #cc8800; }
    .sev-error { color: #cc0000; }
    .row-count { margin-left: auto; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Log Explorer</h1>
  <div class="controls">
    <select id="severity-filter">
      <option value="">All Severities</option>
      <option value="debug">Debug</option>
      <option value="info">Info</option>
      <option value="warn">Warn</option>
      <option value="error">Error</option>
    </select>
    <input type="text" id="search-input" placeholder="Search message..." style="width: 300px;">
    <div class="row-count" id="row-count">0 of 0</div>
  </div>
  <div class="stats" id="stats"></div>
  <div id="virtual-container" class="virtual-container">
    <div id="virtual-inner" class="virtual-inner"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
