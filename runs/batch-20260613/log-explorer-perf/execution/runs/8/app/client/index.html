<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Explorer</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <h1>Log Explorer</h1>
          <p>100k deterministic rows · server-windowed · virtualized DOM</p>
        </div>
        <div id="status" class="status">Starting…</div>
      </header>

      <section class="filters" aria-label="Log filters">
        <label>
          Severity
          <select id="severity">
            <option value="">All severities</option>
            <option value="debug">debug</option>
            <option value="info">info</option>
            <option value="warn">warn</option>
            <option value="error">error</option>
          </select>
        </label>
        <label class="searchLabel">
          Message contains
          <input id="search" type="search" placeholder="Try timeout, common, mercury…" autocomplete="off" />
        </label>
        <button id="clear" type="button">Clear</button>
        <div id="badges" class="badges"></div>
      </section>

      <section class="tableShell">
        <div class="tableHeader" role="row">
          <div>Time</div>
          <div>Severity</div>
          <div>Service</div>
          <div>Message</div>
        </div>
        <div id="scroller" class="scroller" tabindex="0" aria-label="Virtualized logs">
          <div id="spacer" class="spacer">
            <div id="rows" class="rows"></div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
