<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Explorer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-left">
        <h1>📋 Log Explorer</h1>
        <span id="row-count" class="row-count">Loading...</span>
      </div>
      <div class="header-right">
        <div class="filter-group">
          <label for="severity-filter">Severity</label>
          <select id="severity-filter">
            <option value="">All</option>
            <option value="error">Error</option>
            <option value="warn">Warn</option>
            <option value="info">Info</option>
            <option value="debug">Debug</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="search-input">Search</label>
          <input
            type="text"
            id="search-input"
            placeholder="Filter by message..."
            autocomplete="off"
            spellcheck="false"
          />
        </div>
      </div>
    </header>

    <div class="table-container">
      <div class="table-header">
        <div class="col-ts">Timestamp</div>
        <div class="col-severity">Severity</div>
        <div class="col-service">Service</div>
        <div class="col-message">Message</div>
      </div>

      <div id="scroll-container" class="scroll-container">
        <!-- Virtual spacer to set total scroll height -->
        <div id="scroll-spacer" class="scroll-spacer"></div>
        <!-- Visible rows rendered here -->
        <div id="rows-container" class="rows-container"></div>
      </div>
    </div>

    <div id="status-bar" class="status-bar">
      <span id="status-text">Initializing...</span>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
