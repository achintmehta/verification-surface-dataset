<!DOCTYPE html>
<html>
<head>
<style>
  .container {
    width: 200px;
    height: 200px;
    overflow: auto;
    position: relative;
    border: 1px solid black;
  }
  .content {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 1000px;
    background: linear-gradient(red, blue);
  }
</style>
</head>
<body>
  <div class="container">
    <div class="content"></div>
  </div>
</body>
</html>
