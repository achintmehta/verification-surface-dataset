<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Explorer</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        background-color: #f5f5f5;
      }
      header {
        background-color: #fff;
        padding: 16px;
        border-bottom: 1px solid #ddd;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .stats {
        font-size: 14px;
        color: #666;
        margin-left: auto;
      }
      .badge {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
        color: #fff;
        margin-left: 4px;
      }
      .badge.debug { background-color: #888; }
      .badge.info { background-color: #2196f3; }
      .badge.warn { background-color: #ff9800; }
      .badge.error { background-color: #f44336; }
      
      .log-container {
        flex: 1;
        overflow: auto;
        position: relative;
        background-color: #fff;
      }
      .log-scroll-content {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
      }
      .log-row {
        display: flex;
        padding: 8px 16px;
        border-bottom: 1px solid #eee;
        font-family: monospace;
        font-size: 13px;
        position: absolute;
        width: 100%;
        box-sizing: border-box;
      }
      .log-row:hover {
        background-color: #f9f9f9;
      }
      .col-ts { width: 200px; flex-shrink: 0; color: #666; }
      .col-severity { width: 80px; flex-shrink: 0; }
      .col-service { width: 120px; flex-shrink: 0; color: #0066cc; }
      .col-message { flex: 1; white-space: pre-wrap; word-break: break-all; }
      
      .sev-debug { color: #888; }
      .sev-info { color: #2196f3; }
      .sev-warn { color: #ff9800; }
      .sev-error { color: #f44336; }
      
      input, select {
        padding: 6px 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      input {
        width: 300px;
      }
    </style>
  </head>
  <body>
    <header>
      <select id="severity-filter">
        <option value="">All Severities</option>
        <option value="debug">Debug</option>
        <option value="info">Info</option>
        <option value="warn">Warn</option>
        <option value="error">Error</option>
      </select>
      <input type="text" id="search-input" placeholder="Search messages..." />
      <div class="stats" id="stats-container">
        Loading stats...
      </div>
    </header>
    <div class="log-container" id="log-container">
      <div class="log-scroll-content" id="log-scroll-content"></div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
