<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log Explorer</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <h1>Log Explorer</h1>
        <div class="controls">
          <label class="control">
            Severity
            <select id="severity">
              <option value="all">all</option>
              <option value="debug">debug</option>
              <option value="info">info</option>
              <option value="warn">warn</option>
              <option value="error">error</option>
            </select>
          </label>
          <label class="control search">
            Search
            <input id="search" type="search" placeholder="message substring…" autocomplete="off" />
          </label>
          <span id="count" class="count">— of —</span>
          <span id="status" class="status"></span>
        </div>
      </header>

      <div class="table-header">
        <div class="col col-ts">Timestamp</div>
        <div class="col col-sev">Severity</div>
        <div class="col col-svc">Service</div>
        <div class="col col-msg">Message</div>
      </div>

      <div id="viewport" class="viewport">
        <!-- spacer sizes the scrollbar to the full (filtered) corpus -->
        <div id="spacer" class="spacer"></div>
        <!-- absolutely-positioned pool of recycled rows lives here -->
        <div id="rows" class="rows"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
