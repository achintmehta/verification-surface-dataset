<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Explorer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
    select, input { padding: 8px; font-size: 14px; }
    .stats { margin-bottom: 10px; font-size: 14px; color: #333; }
    .virtual-scroller { height: 600px; overflow-y: auto; border: 1px solid #ccc; background: white; position: relative; }
    .virtual-content { position: relative; }
    .log-row { display: flex; padding: 8px 12px; border-bottom: 1px solid #eee; font-size: 13px; font-family: monospace; }
    .log-row:hover { background: #f9f9f9; }
    .col-ts { width: 180px; flex-shrink: 0; }
    .col-sev { width: 70px; flex-shrink: 0; font-weight: bold; }
    .col-svc { width: 100px; flex-shrink: 0; }
    .col-msg { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .debug { color: #6b7280; }
    .info { color: #2563eb; }
    .warn { color: #d97706; }
    .error { color: #dc2626; }
    .row-count { margin-left: auto; }
  </style>
</head>
<body>
  <h1>Log Explorer</h1>
  <div class="controls">
    <select id="severity-filter">
      <option value="">All Severities</option>
      <option value="debug">Debug</option>
      <option value="info">Info</option>
      <option value="warn">Warn</option>
      <option value="error">Error</option>
    </select>
    <input type="text" id="search-box" placeholder="Search message..." style="width: 300px;">
    <div class="row-count" id="row-count">0 of 0</div>
  </div>
  <div class="stats" id="stats"></div>
  <div id="virtual-scroller" class="virtual-scroller">
    <div id="virtual-content" class="virtual-content"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
