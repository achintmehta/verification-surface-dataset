<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Explorer</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <h1>Log Explorer</h1>
      <div class="filters">
        <div class="filter-group">
          <label for="severity-filter">Severity:</label>
          <select id="severity-filter">
            <option value="">All</option>
            <option value="debug">Debug</option>
            <option value="info">Info</option>
            <option value="warn">Warn</option>
            <option value="error">Error</option>
          </select>
          <div id="severity-badges" class="severity-badges"></div>
        </div>
        <div class="filter-group">
          <label for="search-input">Search:</label>
          <input type="text" id="search-input" placeholder="Search messages..." autocomplete="off" />
        </div>
      </div>
      <div class="status-bar">
        <span id="row-count">Loading...</span>
        <span id="loading-indicator" class="hidden">⏳ Loading...</span>
      </div>
    </header>

    <div class="table-container">
      <div class="table-header">
        <div class="col col-ts">Timestamp</div>
        <div class="col col-severity">Severity</div>
        <div class="col col-service">Service</div>
        <div class="col col-message">Message</div>
      </div>
      <div id="virtual-scroller" class="virtual-scroller">
        <div id="scroll-spacer" class="scroll-spacer"></div>
        <div id="row-container" class="row-container"></div>
      </div>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
