<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Explorer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="toolbar-left">
        <h1 class="app-title">
          <span class="app-icon">📋</span>
          Log Explorer
        </h1>
        <div class="row-count" id="row-count">Loading…</div>
      </div>
      <div class="toolbar-right">
        <div class="filter-group">
          <label for="severity-select" class="filter-label">Severity</label>
          <select id="severity-select" class="filter-select">
            <option value="">All</option>
            <option value="error">Error</option>
            <option value="warn">Warn</option>
            <option value="info">Info</option>
            <option value="debug">Debug</option>
          </select>
          <div class="severity-badges" id="severity-badges"></div>
        </div>
        <div class="filter-group">
          <label for="search-input" class="filter-label">Search</label>
          <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Filter by message…"
              autocomplete="off"
              spellcheck="false"
            />
            <button class="search-clear" id="search-clear" aria-label="Clear search">✕</button>
          </div>
        </div>
      </div>
    </header>

    <div class="table-header">
      <div class="col-ts">Timestamp</div>
      <div class="col-severity">Severity</div>
      <div class="col-service">Service</div>
      <div class="col-message">Message</div>
    </div>

    <div class="scroller-container" id="scroller-container">
      <div class="scroller-inner" id="scroller-inner">
        <div class="rows-viewport" id="rows-viewport"></div>
      </div>
    </div>

    <div class="status-bar" id="status-bar">
      <span id="status-text">Initializing…</span>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
