<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Explorer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #f5f5f5;
    }
    header {
      padding: 16px;
      background-color: #fff;
      border-bottom: 1px solid #ddd;
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .stats {
      margin-left: auto;
      font-size: 14px;
      color: #666;
    }
    .log-container {
      flex: 1;
      overflow: auto;
      position: relative;
      background: #fff;
    }
    .log-scroll-content {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
    }
    .log-row {
      display: flex;
      padding: 8px 16px;
      border-bottom: 1px solid #eee;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 13px;
      position: absolute;
      width: 100%;
      height: 32px;
      align-items: center;
      gap: 16px;
    }
    .log-row:hover {
      background-color: #f9f9f9;
    }
    .col-ts { width: 180px; flex-shrink: 0; color: #666; }
    .col-sev { width: 60px; flex-shrink: 0; font-weight: bold; }
    .col-svc { width: 150px; flex-shrink: 0; color: #0066cc; }
    .col-msg { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .sev-debug { color: #888; }
    .sev-info { color: #0066cc; }
    .sev-warn { color: #cc9900; }
    .sev-error { color: #cc0000; }
  </style>
</head>
<body>
  <header>
    <select id="severity-filter">
      <option value="">All Severities</option>
      <option value="debug">Debug</option>
      <option value="info">Info</option>
      <option value="warn">Warn</option>
      <option value="error">Error</option>
    </select>
    <input type="text" id="search-input" placeholder="Search messages..." style="width: 300px; padding: 4px 8px;">
    <div class="stats" id="stats-display">Loading...</div>
  </header>
  <div class="log-container" id="log-container">
    <div class="log-scroll-content" id="log-scroll-content"></div>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
