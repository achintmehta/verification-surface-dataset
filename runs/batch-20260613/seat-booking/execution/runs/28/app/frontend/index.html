<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seat Booking</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      .seat-map { display: grid; grid-template-columns: repeat(10, 40px); gap: 5px; margin: 20px 0; }
      .seat { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid #ccc; cursor: pointer; font-size: 12px; }
      .seat.available { background-color: #90EE90; }
      .seat.held { background-color: #FFD700; }
      .seat.booked { background-color: #FF6B6B; cursor: not-allowed; }
      .seat.selected { background-color: #4CAF50; color: white; }
      .controls { margin: 20px 0; }
      button { padding: 10px 20px; margin-right: 10px; }
      .status { margin: 10px 0; padding: 10px; background: #f0f0f0; }
      .hold-info { color: #333; }
    </style>
  </head>
  <body>
    <h1>Seat Booking System</h1>
    <div class="status">
      <div>Available: <span id="available-count">0</span></div>
      <div>Held: <span id="held-count">0</span></div>
      <div>Booked: <span id="booked-count">0</span></div>
      <div>Total: <span id="total-count">50</span></div>
    </div>
    <div class="controls">
      <button id="hold-btn">Hold Selected Seats</button>
      <button id="confirm-btn" disabled>Confirm Hold</button>
      <button id="release-btn" disabled>Release Hold</button>
      <button id="refresh-btn">Refresh</button>
    </div>
    <div id="hold-info" class="hold-info"></div>
    <div id="seat-map" class="seat-map"></div>
    <div id="message"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
