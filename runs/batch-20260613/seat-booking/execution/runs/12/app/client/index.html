<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seat Booking</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>🎟️ Event Seat Booking</h1>
      <div id="connection" class="conn unknown">connecting…</div>
    </header>

    <main>
      <section class="stage">STAGE</section>

      <div id="seatmap" class="seatmap" aria-label="Seat map"></div>

      <section class="legend">
        <span class="legend-item"><i class="swatch available"></i>Available</span>
        <span class="legend-item"><i class="swatch selected"></i>Selected</span>
        <span class="legend-item"><i class="swatch held"></i>Held (by others)</span>
        <span class="legend-item"><i class="swatch mine"></i>Your hold</span>
        <span class="legend-item"><i class="swatch booked"></i>Booked</span>
      </section>

      <section class="inventory" id="inventory"></section>

      <section class="controls">
        <div id="selection-info">No seats selected.</div>
        <div class="buttons">
          <button id="hold-btn" disabled>Hold selected seats</button>
          <button id="confirm-btn" disabled>Confirm booking</button>
          <button id="release-btn" disabled>Release hold</button>
        </div>
        <div id="countdown" class="countdown hidden"></div>
        <div id="message" class="message" role="status"></div>
      </section>

      <footer>
        <small>Session: <code id="session-id"></code></small>
      </footer>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
