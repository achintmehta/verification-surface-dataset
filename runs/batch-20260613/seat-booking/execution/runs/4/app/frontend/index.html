<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Booking</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>🎭 Seat Booking</h1>
      <p class="subtitle">Select seats, hold them, then confirm your booking.</p>
    </header>

    <!-- Status / notification bar -->
    <div id="notification" class="notification hidden"></div>

    <!-- Legend -->
    <div class="legend">
      <span class="legend-item"><span class="dot available"></span> Available</span>
      <span class="legend-item"><span class="dot held-other"></span> Held by others</span>
      <span class="legend-item"><span class="dot held-mine"></span> Your hold</span>
      <span class="legend-item"><span class="dot booked"></span> Booked</span>
      <span class="legend-item"><span class="dot selected"></span> Selected</span>
    </div>

    <!-- Stage indicator -->
    <div class="stage-label">▼ STAGE ▼</div>

    <!-- Seat map -->
    <div id="seat-map" class="seat-map">
      <div class="loading">Loading seat map…</div>
    </div>

    <!-- Action panel -->
    <div id="action-panel" class="action-panel">
      <!-- Selection mode -->
      <div id="panel-select" class="panel-section">
        <p id="selection-info" class="selection-info">Click available seats to select them.</p>
        <button id="btn-hold" class="btn btn-primary" disabled>Hold Selected Seats</button>
      </div>

      <!-- Hold active mode -->
      <div id="panel-hold" class="panel-section hidden">
        <div class="hold-info">
          <span>Hold expires in: </span>
          <span id="countdown" class="countdown">--:--</span>
        </div>
        <p id="hold-seats-info" class="hold-seats-info"></p>
        <div class="hold-actions">
          <button id="btn-confirm" class="btn btn-success">✓ Confirm Booking</button>
          <button id="btn-release" class="btn btn-danger">✗ Release Hold</button>
        </div>
      </div>

      <!-- Booked mode -->
      <div id="panel-booked" class="panel-section hidden">
        <div class="booked-info">
          <span class="booked-icon">🎟️</span>
          <p id="booked-seats-info" class="booked-seats-info"></p>
        </div>
        <button id="btn-new-booking" class="btn btn-primary">Make Another Booking</button>
      </div>
    </div>

    <!-- Inventory summary -->
    <div id="inventory" class="inventory">
      <span>Available: <strong id="inv-available">–</strong></span>
      <span>Held: <strong id="inv-held">–</strong></span>
      <span>Booked: <strong id="inv-booked">–</strong></span>
      <span>Total: <strong id="inv-total">–</strong></span>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
