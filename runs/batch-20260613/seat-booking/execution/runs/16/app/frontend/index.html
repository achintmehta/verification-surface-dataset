<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seat Booking</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .seat-map { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .row { display: flex; gap: 10px; align-items: center; }
    .row-label { width: 20px; font-weight: bold; }
    .seat {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid #ccc; border-radius: 4px;
      cursor: pointer; user-select: none;
    }
    .seat.available { background-color: #e0ffe0; }
    .seat.held { background-color: #ffe0e0; cursor: not-allowed; }
    .seat.booked { background-color: #e0e0e0; cursor: not-allowed; color: #888; }
    .seat.selected { border: 2px solid #000; background-color: #d0f0ff; }
    .controls { margin-top: 20px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    #message { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Seat Booking</h1>
  <div id="seat-map" class="seat-map"></div>
  <div class="controls">
    <button id="hold-btn">Hold Selected Seats</button>
    <button id="confirm-btn" style="display: none;">Confirm Booking</button>
    <button id="release-btn" style="display: none;">Release Hold</button>
  </div>
  <div id="message"></div>
  <div id="countdown"></div>

  <script type="module" src="/main.js"></script>
</body>
</html>
