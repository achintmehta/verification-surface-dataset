<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seat Booking</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>🎭 Seat Booking</h1>
        <div id="connection-status" class="disconnected">● Disconnected</div>
      </header>

      <div id="inventory-bar">
        <span id="inv-available">Available: -</span>
        <span id="inv-held">Held: -</span>
        <span id="inv-booked">Booked: -</span>
        <span id="inv-total">Total: -</span>
      </div>

      <div id="legend">
        <span class="legend-item"><span class="legend-color available"></span> Available</span>
        <span class="legend-item"><span class="legend-color held"></span> Held</span>
        <span class="legend-item"><span class="legend-color my-held"></span> My Hold</span>
        <span class="legend-item"><span class="legend-color booked"></span> Booked</span>
        <span class="legend-item"><span class="legend-color selected"></span> Selected</span>
      </div>

      <div id="seat-map"></div>

      <div id="actions">
        <div id="selection-info">Select seats to hold them</div>
        <div id="action-buttons">
          <button id="btn-hold" disabled>Hold Selected Seats</button>
          <button id="btn-confirm" disabled style="display:none">Confirm Booking</button>
          <button id="btn-release" disabled style="display:none">Release Hold</button>
        </div>
        <div id="hold-timer" style="display:none">
          Hold expires in: <span id="timer-countdown">--</span>s
        </div>
        <div id="error-message" style="display:none"></div>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
