<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Booking</title>
  <script type="module" crossorigin src="/assets/index-CzR3CfWD.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-lrjo_fB0.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🎭 Seat Booking</h1>
      <div id="session-info">
        Session: <span id="session-id-display"></span>
      </div>
    </header>

    <main>
      <!-- Status / notification bar -->
      <div id="notification" class="notification hidden" role="alert"></div>

      <!-- Legend -->
      <div class="legend">
        <span class="legend-item"><span class="seat-demo available"></span> Available</span>
        <span class="legend-item"><span class="seat-demo held-own"></span> Your Hold</span>
        <span class="legend-item"><span class="seat-demo held-other"></span> Held by Other</span>
        <span class="legend-item"><span class="seat-demo booked"></span> Booked</span>
        <span class="legend-item"><span class="seat-demo selected"></span> Selected</span>
      </div>

      <!-- Stage indicator -->
      <div class="stage-label">🎬 STAGE</div>

      <!-- Seat map -->
      <div id="seat-map" class="seat-map" aria-label="Seat map"></div>

      <!-- Action panel -->
      <div id="action-panel" class="action-panel">
        <!-- Hold panel (shown when seats are selected but no active hold) -->
        <div id="hold-panel" class="panel hidden">
          <p>Selected: <strong id="selected-count">0</strong> seat(s)</p>
          <p id="selected-seat-list" class="seat-list"></p>
          <button id="btn-hold" class="btn btn-primary">Hold Selected Seats</button>
          <button id="btn-clear-selection" class="btn btn-secondary">Clear Selection</button>
        </div>

        <!-- Active hold panel (shown when a hold is active) -->
        <div id="active-hold-panel" class="panel hidden">
          <div class="hold-info">
            <p>🔒 Hold active for: <strong id="hold-seat-list"></strong></p>
            <p>Expires in: <span id="hold-countdown" class="countdown">--</span></p>
          </div>
          <div class="hold-actions">
            <button id="btn-confirm" class="btn btn-success">✓ Confirm Booking</button>
            <button id="btn-release" class="btn btn-danger">✗ Release Hold</button>
          </div>
        </div>

        <!-- Booking confirmed panel -->
        <div id="booked-panel" class="panel hidden">
          <div class="booked-info">
            <p>🎉 Booking confirmed!</p>
            <p>Booked seats: <strong id="booked-seat-list"></strong></p>
          </div>
          <button id="btn-new-booking" class="btn btn-primary">Make Another Booking</button>
        </div>

        <!-- Default panel (no selection, no hold) -->
        <div id="default-panel" class="panel">
          <p class="hint">Click available seats to select them, then place a hold.</p>
        </div>
      </div>

      <!-- Inventory summary -->
      <div id="inventory" class="inventory">
        <span>Available: <strong id="inv-available">–</strong></span>
        <span>Held: <strong id="inv-held">–</strong></span>
        <span>Booked: <strong id="inv-booked">–</strong></span>
        <span>Total: <strong id="inv-total">–</strong></span>
      </div>
    </main>
  </div>

</body>
</html>
