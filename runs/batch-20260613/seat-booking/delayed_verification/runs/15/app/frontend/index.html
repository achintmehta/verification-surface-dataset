<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seat Booking</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>🎭 Seat Booking</h1>
        <div class="status-bar">
          <span id="connection" class="conn disconnected">● connecting…</span>
          <span id="inventory" class="inventory"></span>
        </div>
      </header>

      <main>
        <div class="screen">SCREEN</div>
        <div id="seatmap" class="seatmap" aria-label="Seat map"></div>

        <div class="legend">
          <span><i class="swatch available"></i> Available</span>
          <span><i class="swatch selected"></i> Selected</span>
          <span><i class="swatch held"></i> Held</span>
          <span><i class="swatch mine"></i> Your hold</span>
          <span><i class="swatch booked"></i> Booked</span>
        </div>
      </main>

      <aside class="panel">
        <div class="session">
          Session: <code id="session-id"></code>
        </div>

        <div id="selection-info" class="selection-info">
          No seats selected.
        </div>

        <div class="actions">
          <button id="hold-btn" disabled>Hold selected seats</button>
          <button id="confirm-btn" class="primary" disabled>Confirm booking</button>
          <button id="release-btn" class="danger" disabled>Release hold</button>
        </div>

        <div id="countdown" class="countdown hidden"></div>
        <div id="message" class="message" role="status"></div>
      </aside>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
