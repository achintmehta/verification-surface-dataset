<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seat Booking</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>🎭 Seat Booking</h1>
        <p class="subtitle">Select seats, place a hold, then confirm to book.</p>
      </header>

      <main>
        <!-- Legend -->
        <div class="legend">
          <span class="legend-item"><span class="dot available"></span>Available</span>
          <span class="legend-item"><span class="dot held-own"></span>Your Hold</span>
          <span class="legend-item"><span class="dot held-other"></span>Held by Other</span>
          <span class="legend-item"><span class="dot booked"></span>Booked</span>
        </div>

        <!-- Stage indicator -->
        <div class="stage">STAGE</div>

        <!-- Seat map -->
        <div id="seat-map" class="seat-map" aria-label="Seat map">
          <div class="loading">Loading seats…</div>
        </div>

        <!-- Action panel -->
        <div id="action-panel" class="action-panel hidden">
          <!-- Selection info -->
          <div id="selection-info" class="panel-section">
            <h2>Selected Seats</h2>
            <div id="selected-seats-list" class="chip-list"></div>
            <button id="btn-hold" class="btn btn-primary">Place Hold</button>
          </div>

          <!-- Hold info -->
          <div id="hold-info" class="panel-section hidden">
            <h2>Active Hold</h2>
            <div id="hold-seats-list" class="chip-list"></div>
            <div class="hold-meta">
              <span>Hold expires in: </span>
              <span id="hold-countdown" class="countdown">--</span>
            </div>
            <div class="hold-actions">
              <button id="btn-confirm" class="btn btn-success">Confirm Booking</button>
              <button id="btn-release" class="btn btn-danger">Release Hold</button>
            </div>
          </div>

          <!-- Booking confirmation -->
          <div id="booking-info" class="panel-section hidden">
            <h2>✅ Booking Confirmed!</h2>
            <div id="booked-seats-list" class="chip-list"></div>
            <button id="btn-new-booking" class="btn btn-primary">Book More Seats</button>
          </div>
        </div>

        <!-- Error / notification banner -->
        <div id="notification" class="notification hidden" role="alert"></div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
