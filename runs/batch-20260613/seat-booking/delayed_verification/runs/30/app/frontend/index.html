<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seat Booking</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; background: #f5f5f5; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; }
    .seat-map { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; margin: 20px 0; padding: 20px; background: white; border-radius: 8px; }
    .seat { 
      aspect-ratio: 1; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      border-radius: 4px; 
      font-size: 12px; 
      cursor: pointer; 
      border: 2px solid #ccc;
      transition: all 0.2s;
    }
    .seat.available { background: #e8f5e9; border-color: #4caf50; }
    .seat.available:hover { background: #c8e6c9; }
    .seat.held { background: #fff3e0; border-color: #ff9800; cursor: not-allowed; }
    .seat.booked { background: #ffebee; border-color: #f44336; cursor: not-allowed; }
    .seat.selected { background: #bbdefb; border-color: #2196f3; }
    .controls { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    .status { text-align: center; margin: 10px 0; font-weight: bold; }
    .hold-info { background: white; padding: 15px; border-radius: 8px; margin: 20px 0; text-align: center; }
    .legend { display: flex; gap: 20px; justify-content: center; margin: 20px 0; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-color { width: 20px; height: 20px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Seat Booking - Live</h1>
    
    <div class="legend">
      <div class="legend-item"><div class="legend-color" style="background: #e8f5e9; border: 2px solid #4caf50;"></div> Available</div>
      <div class="legend-item"><div class="legend-color" style="background: #fff3e0; border: 2px solid #ff9800;"></div> Held</div>
      <div class="legend-item"><div class="legend-color" style="background: #ffebee; border: 2px solid #f44336;"></div> Booked</div>
      <div class="legend-item"><div class="legend-color" style="background: #bbdefb; border: 2px solid #2196f3;"></div> Selected</div>
    </div>

    <div id="seat-map" class="seat-map"></div>

    <div class="controls">
      <button id="hold-btn" disabled>Hold Selected Seats</button>
      <button id="confirm-btn" disabled>Confirm Hold</button>
      <button id="release-btn" disabled>Release Hold</button>
      <button id="refresh-btn">Refresh</button>
    </div>

    <div id="hold-info" class="hold-info" style="display: none;">
      <div>Hold active: <span id="hold-id"></span></div>
      <div>Expires in: <span id="countdown"></span></div>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
