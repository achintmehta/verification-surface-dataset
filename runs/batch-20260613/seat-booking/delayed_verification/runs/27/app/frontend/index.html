<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seat Booking</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; background: #f5f5f5; }
    h1 { text-align: center; }
    .seat-map { display: grid; grid-template-columns: repeat(10, 40px); gap: 8px; justify-content: center; margin: 20px 0; }
    .seat { width: 40px; height: 40px; border: 1px solid #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; user-select: none; }
    .seat.available { background: #90EE90; }
    .seat.available:hover { background: #7CCD7C; }
    .seat.held { background: #FFD700; }
    .seat.booked { background: #FF6B6B; color: white; cursor: not-allowed; }
    .seat.selected { background: #4CAF50; color: white; border-color: #2E7D32; }
    .controls { text-align: center; margin: 20px 0; }
    button { padding: 10px 20px; margin: 0 10px; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { text-align: center; margin: 10px; font-weight: bold; }
    .hold-info { text-align: center; margin: 15px; padding: 10px; background: white; border-radius: 8px; display: none; }
    .legend { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-color { width: 20px; height: 20px; border: 1px solid #333; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>Seat Booking - Live</h1>
  
  <div class="legend">
    <div class="legend-item"><div class="legend-color" style="background: #90EE90"></div> Available</div>
    <div class="legend-item"><div class="legend-color" style="background: #FFD700"></div> Held</div>
    <div class="legend-item"><div class="legend-color" style="background: #FF6B6B"></div> Booked</div>
    <div class="legend-item"><div class="legend-color" style="background: #4CAF50"></div> Selected</div>
  </div>

  <div id="seat-map" class="seat-map"></div>

  <div class="controls">
    <button id="hold-btn" disabled>Hold Selected Seats</button>
    <button id="confirm-btn" disabled>Confirm Hold</button>
    <button id="release-btn" disabled>Release Hold</button>
    <button id="refresh-btn">Refresh</button>
  </div>

  <div id="hold-info" class="hold-info">
    <div>Hold active: <span id="hold-id"></span></div>
    <div>Expires in: <span id="countdown"></span></div>
  </div>

  <div id="status" class="status"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
