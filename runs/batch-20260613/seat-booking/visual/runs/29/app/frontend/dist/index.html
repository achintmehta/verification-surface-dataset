<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seat Booking</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; background: #f5f5f5; }
    h1 { color: #333; }
    .seat-map { display: flex; flex-direction: column; gap: 8px; margin: 20px 0; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row-label { width: 30px; font-weight: bold; }
    .seat { 
      width: 40px; height: 40px; 
      border: 2px solid #333; 
      display: flex; align-items: center; justify-content: center; 
      cursor: pointer; font-size: 12px; font-weight: bold;
      transition: all 0.2s;
    }
    .seat.available { background: #90EE90; }
    .seat.available:hover { background: #7CCD7C; }
    .seat.held { background: #FFD700; cursor: not-allowed; }
    .seat.booked { background: #FF6B6B; cursor: not-allowed; }
    .seat.selected { background: #4CAF50; color: white; border-color: #2E7D32; }
    .controls { margin: 20px 0; }
    button { padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin: 10px 0; padding: 10px; background: white; border-radius: 4px; }
    .hold-info { background: #fff3cd; padding: 15px; border-radius: 8px; margin: 15px 0; }
    .countdown { font-weight: bold; color: #d32f2f; }
    .legend { display: flex; gap: 20px; margin: 15px 0; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-color { width: 24px; height: 24px; border: 1px solid #333; }
  </style>
  <script type="module" crossorigin src="/assets/index-VYrHkhse.js"></script>
</head>
<body>
  <h1>🎟️ Seat Booking - Live</h1>
  
  <div class="legend">
    <div class="legend-item"><div class="legend-color" style="background: #90EE90;"></div> Available</div>
    <div class="legend-item"><div class="legend-color" style="background: #FFD700;"></div> Held</div>
    <div class="legend-item"><div class="legend-color" style="background: #FF6B6B;"></div> Booked</div>
    <div class="legend-item"><div class="legend-color" style="background: #4CAF50;"></div> Selected</div>
  </div>
  
  <div id="inventory" class="status"></div>
  
  <div id="seat-map" class="seat-map"></div>
  
  <div class="controls">
    <button id="hold-btn" disabled>Hold Selected Seats</button>
    <button id="confirm-btn" disabled>Confirm Booking</button>
    <button id="release-btn" disabled>Release Hold</button>
    <button id="refresh-btn">Refresh Map</button>
  </div>
  
  <div id="hold-info" class="hold-info" style="display: none;">
    <p>Hold active: <span id="hold-id"></span></p>
    <p>Expires in: <span id="countdown" class="countdown"></span></p>
  </div>
  
  <div id="messages"></div>
  
</body>
</html>
