<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Booking</title>
  <script type="module" crossorigin src="/assets/index-CQheVakr.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CcW35JNS.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🎭 Seat Booking</h1>
      <div id="status-bar">
        <span id="inventory-available">Available: —</span>
        <span id="inventory-held">Held: —</span>
        <span id="inventory-booked">Booked: —</span>
        <span id="sse-status" class="sse-disconnected">● Disconnected</span>
      </div>
    </header>

    <div id="stage-label">STAGE</div>

    <div id="seat-map"></div>

    <div id="selection-panel" class="hidden">
      <h3>Selected Seats</h3>
      <div id="selected-seats-list"></div>
      <div id="panel-actions">
        <button id="btn-hold" class="btn btn-hold">Hold Selected</button>
        <button id="btn-clear" class="btn btn-clear">Clear Selection</button>
      </div>
    </div>

    <div id="hold-panel" class="hidden">
      <h3>Your Hold</h3>
      <div id="hold-info"></div>
      <div id="hold-timer"></div>
      <div id="hold-actions">
        <button id="btn-confirm" class="btn btn-confirm">Confirm Booking</button>
        <button id="btn-release" class="btn btn-release">Release Hold</button>
      </div>
    </div>

    <div id="toast-container"></div>
  </div>

</body>
</html>
