<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seat Booking</title>
  </head>
  <body>
    <div id="app">
      <h1>Seat Booking - Theater Event</h1>
      <div id="status">Loading seats...</div>
      <div id="inventory"></div>
      <div id="seat-map"></div>
      <div id="controls">
        <button id="hold-btn" disabled>Hold Selected Seats</button>
        <button id="confirm-btn" disabled>Confirm Hold</button>
        <button id="release-btn" disabled>Release Hold</button>
      </div>
      <div id="hold-info"></div>
      <div id="messages"></div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
