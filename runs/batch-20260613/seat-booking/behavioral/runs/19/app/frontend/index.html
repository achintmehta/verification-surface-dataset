<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Booking</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <h1>Seat Booking</h1>
    
    <div class="status-bar">
      <div id="message">Select seats to hold...</div>
      <div id="timer" class="hidden"></div>
    </div>

    <div class="controls">
      <button id="btn-hold" disabled>Hold Selected</button>
      <button id="btn-confirm" class="hidden">Confirm Booking</button>
      <button id="btn-release" class="hidden">Release Hold</button>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="seat available"></div> Available</div>
      <div class="legend-item"><div class="seat held"></div> Held</div>
      <div class="legend-item"><div class="seat booked"></div> Booked</div>
      <div class="legend-item"><div class="seat selected"></div> Selected</div>
      <div class="legend-item"><div class="seat my-held"></div> My Hold</div>
    </div>

    <div id="seat-map" class="seat-map"></div>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
