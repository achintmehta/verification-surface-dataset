<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Booking</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>🎭 Seat Booking</h1>
      <div id="session-info">
        Session: <span id="session-id-display"></span>
      </div>
    </header>

    <main>
      <!-- Legend -->
      <div class="legend">
        <span class="legend-item"><span class="seat-demo available"></span> Available</span>
        <span class="legend-item"><span class="seat-demo held"></span> Held</span>
        <span class="legend-item"><span class="seat-demo held-mine"></span> Your Hold</span>
        <span class="legend-item"><span class="seat-demo selected"></span> Selected</span>
        <span class="legend-item"><span class="seat-demo booked"></span> Booked</span>
      </div>

      <!-- Stage indicator -->
      <div class="stage">🎬 STAGE</div>

      <!-- Seat map -->
      <div id="seat-map" class="seat-map">
        <div class="loading">Loading seats…</div>
      </div>

      <!-- Action panel -->
      <div id="action-panel" class="action-panel">
        <div id="selection-info" class="selection-info hidden">
          <p>Selected: <span id="selected-count">0</span> seat(s):
            <span id="selected-ids"></span>
          </p>
          <button id="btn-hold" class="btn btn-primary">Hold Selected Seats</button>
        </div>

        <div id="hold-info" class="hold-info hidden">
          <p>
            Hold active for seats: <strong id="hold-seat-ids"></strong>
          </p>
          <p>
            Expires in: <span id="hold-countdown" class="countdown">--</span>
          </p>
          <div class="hold-actions">
            <button id="btn-confirm" class="btn btn-success">Confirm Booking</button>
            <button id="btn-release" class="btn btn-danger">Release Hold</button>
          </div>
        </div>

        <div id="booking-info" class="booking-info hidden">
          <p>✅ Booking confirmed for seats: <strong id="booked-seat-ids"></strong></p>
          <button id="btn-new-booking" class="btn btn-secondary">Make Another Booking</button>
        </div>

        <div id="error-info" class="error-info hidden">
          <p id="error-message"></p>
          <button id="btn-dismiss-error" class="btn btn-secondary">Dismiss</button>
        </div>
      </div>

      <!-- Inventory summary -->
      <div id="inventory" class="inventory">
        <span>Available: <strong id="inv-available">-</strong></span>
        <span>Held: <strong id="inv-held">-</strong></span>
        <span>Booked: <strong id="inv-booked">-</strong></span>
        <span>Total: <strong id="inv-total">-</strong></span>
      </div>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
