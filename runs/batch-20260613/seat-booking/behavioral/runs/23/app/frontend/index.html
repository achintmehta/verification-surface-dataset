<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Booking</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <h1>🎭 Seat Booking</h1>
    <div id="status-bar">
      <span id="inventory"></span>
      <span id="session-info"></span>
    </div>

    <div id="seat-map"></div>

    <div id="controls">
      <div id="selection-info">Select seats to hold them</div>
      <button id="hold-btn" disabled>Hold Selected Seats</button>
      <button id="confirm-btn" disabled>Confirm Booking</button>
      <button id="release-btn" disabled>Release Hold</button>
    </div>

    <div id="countdown" style="display:none">
      Hold expires in: <span id="timer">--</span>s
    </div>

    <div id="messages"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
