<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seat Booking</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>🎫 Seat Booking</h1>
      <div id="inventory" class="inventory"></div>
      <div id="connection" class="conn" title="Live connection status">●</div>
    </header>

    <main>
      <div class="screen">SCREEN</div>
      <div id="seatmap" class="seatmap" aria-label="Seat map"></div>

      <div class="legend">
        <span><i class="swatch available"></i> Available</span>
        <span><i class="swatch selected"></i> Selected</span>
        <span><i class="swatch held"></i> Held</span>
        <span><i class="swatch mine"></i> Your hold</span>
        <span><i class="swatch booked"></i> Booked</span>
      </div>
    </main>

    <footer class="controls">
      <div id="selection-info" class="selection-info">No seats selected.</div>
      <div class="buttons">
        <button id="hold-btn" disabled>Hold selected seats</button>
        <button id="confirm-btn" disabled>Confirm hold</button>
        <button id="release-btn" disabled>Release hold</button>
      </div>
      <div id="countdown" class="countdown" hidden></div>
      <div id="message" class="message" role="status"></div>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
