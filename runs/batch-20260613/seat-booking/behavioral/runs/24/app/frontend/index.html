<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Booking</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <h1>🎫 Seat Booking</h1>
    <div id="inventory"></div>
    <div id="seat-map"></div>
    <div id="controls">
      <div id="selection-info">Select seats to hold</div>
      <button id="btn-hold" disabled>Hold Selected Seats</button>
      <button id="btn-confirm" disabled>Confirm Booking</button>
      <button id="btn-release" disabled>Release Hold</button>
    </div>
    <div id="status-bar"></div>
    <div id="countdown"></div>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
