<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seat Booking</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>Live Seat Booking</h1>
        <div class="status-line">
          <span id="connection" class="conn conn--connecting">connecting…</span>
          <span id="inventory" class="inventory"></span>
        </div>
      </header>

      <section class="stage">SCREEN / STAGE</section>

      <section id="seatmap" class="seatmap" aria-label="Seat map"></section>

      <section class="legend">
        <span class="legend-item"><span class="swatch swatch--available"></span>Available</span>
        <span class="legend-item"><span class="swatch swatch--selected"></span>Selected</span>
        <span class="legend-item"><span class="swatch swatch--held"></span>Held</span>
        <span class="legend-item"><span class="swatch swatch--mine"></span>Your hold</span>
        <span class="legend-item"><span class="swatch swatch--booked"></span>Booked</span>
      </section>

      <section class="controls">
        <div id="message" class="message" role="status"></div>
        <div class="buttons">
          <button id="hold-btn" disabled>Hold selected seats</button>
          <button id="confirm-btn" disabled>Confirm booking</button>
          <button id="release-btn" disabled>Release hold</button>
        </div>
        <div id="countdown" class="countdown" hidden></div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
