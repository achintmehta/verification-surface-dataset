<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Booking</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <h1>🎫 Seat Booking</h1>
    <div id="status-bar">
      <span id="inventory-info">Loading...</span>
      <span id="connection-status" class="disconnected">● Disconnected</span>
    </div>
    <div id="seat-map"></div>
    <div id="controls">
      <div id="selection-info">Select seats to hold them</div>
      <div id="hold-info" style="display: none;">
        <span id="hold-timer"></span>
        <button id="confirm-btn">Confirm Booking</button>
        <button id="release-btn">Release Hold</button>
      </div>
      <button id="hold-btn" disabled>Hold Selected Seats</button>
    </div>
    <div id="error-message" style="display: none;"></div>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
