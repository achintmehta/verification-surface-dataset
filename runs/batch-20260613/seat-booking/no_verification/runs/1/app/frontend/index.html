<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Booking</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>🎭 Seat Booking</h1>
      <div id="session-info">
        Session: <span id="session-id-display"></span>
      </div>
    </header>

    <main>
      <!-- Legend -->
      <div class="legend">
        <span class="legend-item"><span class="seat-demo available"></span> Available</span>
        <span class="legend-item"><span class="seat-demo held-own"></span> Your Hold</span>
        <span class="legend-item"><span class="seat-demo held-other"></span> Held by Other</span>
        <span class="legend-item"><span class="seat-demo booked"></span> Booked</span>
        <span class="legend-item"><span class="seat-demo selected"></span> Selected</span>
      </div>

      <!-- Stage indicator -->
      <div class="stage">STAGE</div>

      <!-- Seat map -->
      <div id="seat-map" class="seat-map">
        <div class="loading">Loading seats…</div>
      </div>

      <!-- Action panel -->
      <div id="action-panel" class="action-panel">
        <!-- Selection state -->
        <div id="selection-panel" class="panel hidden">
          <p>Selected: <strong id="selected-count">0</strong> seat(s):
            <span id="selected-ids"></span>
          </p>
          <button id="btn-hold" class="btn btn-primary">Hold Selected Seats</button>
          <button id="btn-clear" class="btn btn-secondary">Clear Selection</button>
        </div>

        <!-- Active hold state -->
        <div id="hold-panel" class="panel hidden">
          <div class="hold-info">
            <div>
              <strong>Hold active!</strong>
              Seats: <span id="hold-seat-ids"></span>
            </div>
            <div class="countdown-wrap">
              Expires in: <span id="countdown" class="countdown">--</span>
            </div>
          </div>
          <div class="hold-actions">
            <button id="btn-confirm" class="btn btn-success">Confirm Booking</button>
            <button id="btn-release" class="btn btn-danger">Release Hold</button>
          </div>
        </div>

        <!-- Booked state -->
        <div id="booked-panel" class="panel hidden">
          <div class="booked-info">
            ✅ <strong>Booking confirmed!</strong>
            Seats: <span id="booked-seat-ids"></span>
          </div>
          <button id="btn-new-booking" class="btn btn-primary">Make Another Booking</button>
        </div>

        <!-- Error / info messages -->
        <div id="message-area" class="message-area hidden"></div>
      </div>
    </main>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
