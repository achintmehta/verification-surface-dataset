<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seat Booking</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <h1>Seat Booking - Event</h1>
    <div id="status">Loading seats...</div>
    <div id="seat-map"></div>
    <div id="controls">
      <button id="hold-btn" disabled>Hold Selected Seats</button>
      <button id="confirm-btn" disabled>Confirm Hold</button>
      <button id="release-btn" disabled>Release Hold</button>
      <div id="hold-info"></div>
    </div>
    <div id="inventory">
      <span>Available: <span id="avail-count">0</span></span>
      <span>Held: <span id="held-count">0</span></span>
      <span>Booked: <span id="booked-count">0</span></span>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
