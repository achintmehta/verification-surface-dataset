<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seat Booking</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <h1>Seat Booking - Theater Event</h1>
    <div id="status">Loading seats...</div>
    <div id="inventory"></div>
    <div id="seat-map"></div>
    <div id="hold-panel" style="display: none;">
      <h2>Your Hold</h2>
      <div id="hold-info"></div>
      <div id="countdown"></div>
      <button id="confirm-btn">Confirm Booking</button>
      <button id="release-btn">Release Hold</button>
    </div>
    <div id="messages"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
