<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Booking</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>🎭 Seat Booking</h1>
      <div id="session-info">
        Session: <span id="session-id-display"></span>
      </div>
    </header>

    <main>
      <!-- Legend -->
      <div class="legend">
        <span class="legend-item"><span class="seat-demo available"></span> Available</span>
        <span class="legend-item"><span class="seat-demo held"></span> Held</span>
        <span class="legend-item"><span class="seat-demo held-mine"></span> Your Hold</span>
        <span class="legend-item"><span class="seat-demo booked"></span> Booked</span>
        <span class="legend-item"><span class="seat-demo selected"></span> Selected</span>
      </div>

      <!-- Seat map -->
      <div id="stage-label">STAGE</div>
      <div id="seat-map" class="seat-map">
        <div class="loading">Loading seats…</div>
      </div>

      <!-- Action panel -->
      <div id="action-panel" class="action-panel">
        <!-- Selection state -->
        <div id="panel-select" class="panel-section hidden">
          <p>Selected: <strong id="selected-count">0</strong> seat(s)
            <span id="selected-ids" class="seat-ids"></span>
          </p>
          <button id="btn-hold" class="btn btn-primary">Hold Selected Seats</button>
          <button id="btn-clear" class="btn btn-secondary">Clear Selection</button>
        </div>

        <!-- Active hold state -->
        <div id="panel-hold" class="panel-section hidden">
          <div class="hold-info">
            <p>🔒 Hold active for seats: <strong id="hold-seat-ids"></strong></p>
            <p>Expires in: <strong id="hold-countdown" class="countdown"></strong></p>
          </div>
          <div class="hold-actions">
            <button id="btn-confirm" class="btn btn-success">✓ Confirm Booking</button>
            <button id="btn-release" class="btn btn-danger">✗ Release Hold</button>
          </div>
        </div>

        <!-- Booked state -->
        <div id="panel-booked" class="panel-section hidden">
          <div class="booked-info">
            <p>✅ Booking confirmed!</p>
            <p>Booked seats: <strong id="booked-seat-ids"></strong></p>
          </div>
          <button id="btn-new-booking" class="btn btn-primary">Make Another Booking</button>
        </div>

        <!-- Error / info messages -->
        <div id="panel-message" class="panel-section hidden">
          <div id="message-content" class="message"></div>
          <button id="btn-dismiss" class="btn btn-secondary">Dismiss</button>
        </div>
      </div>

      <!-- Inventory summary -->
      <div id="inventory" class="inventory">
        <span>Available: <strong id="inv-available">–</strong></span>
        <span>Held: <strong id="inv-held">–</strong></span>
        <span>Booked: <strong id="inv-booked">–</strong></span>
        <span>Total: <strong id="inv-total">–</strong></span>
      </div>
    </main>

    <!-- SSE status indicator -->
    <div id="sse-status" class="sse-status disconnected" title="Live updates">⬤ Connecting…</div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
