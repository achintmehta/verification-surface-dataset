<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Booking</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>🎭 Seat Booking</h1>
      <p class="subtitle">Select seats, hold them, then confirm your booking</p>
    </header>

    <div class="layout">
      <div class="seat-map-container">
        <div class="stage">STAGE</div>
        <div id="seat-map"></div>
        <div class="legend">
          <span class="legend-item"><span class="seat-dot available"></span> Available</span>
          <span class="legend-item"><span class="seat-dot held"></span> Held</span>
          <span class="legend-item"><span class="seat-dot held-mine"></span> Your Hold</span>
          <span class="legend-item"><span class="seat-dot booked"></span> Booked</span>
          <span class="legend-item"><span class="seat-dot selected"></span> Selected</span>
        </div>
      </div>

      <div class="sidebar">
        <div class="inventory-panel">
          <h3>Inventory</h3>
          <div id="inventory">
            <span>Available: <strong id="inv-available">-</strong></span>
            <span>Held: <strong id="inv-held">-</strong></span>
            <span>Booked: <strong id="inv-booked">-</strong></span>
            <span>Total: <strong id="inv-total">-</strong></span>
          </div>
        </div>

        <div class="actions-panel">
          <h3>Actions</h3>
          <div id="selected-info">
            <p id="selected-count">No seats selected</p>
          </div>
          <button id="btn-hold" disabled>Hold Selected Seats</button>
          <button id="btn-confirm" disabled>Confirm Booking</button>
          <button id="btn-release" disabled>Release Hold</button>
        </div>

        <div id="hold-info" class="hold-panel" style="display:none">
          <h3>Your Hold</h3>
          <p>Hold ID: <code id="hold-id-display"></code></p>
          <p>Seats: <span id="hold-seats-display"></span></p>
          <p>Expires in: <strong id="hold-countdown"></strong></p>
        </div>

        <div id="status-msg" class="status-msg"></div>

        <div class="connection-status">
          <span id="sse-status" class="sse-indicator disconnected"></span>
          <span id="sse-label">Disconnected</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
