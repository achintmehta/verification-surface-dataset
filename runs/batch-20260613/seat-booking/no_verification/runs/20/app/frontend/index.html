<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seat Booking</title>
    <style>
      body { font-family: sans-serif; padding: 20px; }
      .seat-map { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
      .row { display: flex; gap: 10px; align-items: center; }
      .row-label { width: 20px; font-weight: bold; }
      .seat {
        width: 40px; height: 40px;
        display: flex; align-items: center; justify-content: center;
        border: 1px solid #ccc; border-radius: 4px;
        cursor: pointer; user-select: none;
      }
      .seat.available { background-color: #e0ffe0; }
      .seat.held { background-color: #ffe0e0; cursor: not-allowed; }
      .seat.booked { background-color: #e0e0e0; cursor: not-allowed; color: #888; }
      .seat.selected { border: 2px solid #000; background-color: #c0e0ff; }
      .seat.my-held { background-color: #fff0c0; border: 2px solid #ff9900; }
      .controls { margin-top: 20px; }
      button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.5; }
      #timer { font-weight: bold; color: red; margin-left: 10px; }
    </style>
  </head>
  <body>
    <h1>Seat Booking</h1>
    <div id="seat-map" class="seat-map"></div>
    <div class="controls">
      <button id="hold-btn" disabled>Hold Selected Seats</button>
      <button id="confirm-btn" disabled>Confirm Booking</button>
      <button id="release-btn" disabled>Release Hold</button>
      <span id="timer"></span>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
