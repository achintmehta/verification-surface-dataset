<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seat Booking</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>🎭 Seat Booking</h1>
        <p class="subtitle">Select seats, hold them, then confirm your booking.</p>
      </header>

      <main>
        <!-- Status bar -->
        <div id="status-bar" class="status-bar" aria-live="polite"></div>

        <!-- Legend -->
        <div class="legend">
          <span class="legend-item"><span class="seat-demo available"></span> Available</span>
          <span class="legend-item"><span class="seat-demo selected"></span> Selected</span>
          <span class="legend-item"><span class="seat-demo held-own"></span> Your Hold</span>
          <span class="legend-item"><span class="seat-demo held-other"></span> Held by Other</span>
          <span class="legend-item"><span class="seat-demo booked"></span> Booked</span>
        </div>

        <!-- Seat map -->
        <div id="seat-map" class="seat-map" role="group" aria-label="Seat map"></div>

        <!-- Stage indicator -->
        <div class="stage">STAGE</div>

        <!-- Action panel -->
        <div id="action-panel" class="action-panel">
          <div id="selection-info" class="selection-info hidden">
            <span id="selected-count">0</span> seat(s) selected
          </div>

          <div id="hold-panel" class="hold-panel hidden">
            <div class="hold-info">
              <span>Hold expires in: </span>
              <span id="countdown" class="countdown">--</span>
            </div>
            <div class="hold-seats">
              Held seats: <span id="held-seats-list"></span>
            </div>
          </div>

          <div class="action-buttons">
            <button id="btn-hold" class="btn btn-primary" disabled>
              Hold Selected Seats
            </button>
            <button id="btn-confirm" class="btn btn-success" disabled>
              Confirm Booking
            </button>
            <button id="btn-release" class="btn btn-danger" disabled>
              Release Hold
            </button>
            <button id="btn-clear" class="btn btn-secondary" disabled>
              Clear Selection
            </button>
          </div>
        </div>

        <!-- Inventory summary -->
        <div id="inventory" class="inventory">
          <span>Available: <strong id="inv-available">–</strong></span>
          <span>Held: <strong id="inv-held">–</strong></span>
          <span>Booked: <strong id="inv-booked">–</strong></span>
          <span>Total: <strong id="inv-total">–</strong></span>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
