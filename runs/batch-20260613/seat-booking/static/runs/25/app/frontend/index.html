<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Booking</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>🎫 Seat Booking</h1>
      <p class="session-info">Session: <code id="session-id"></code></p>
    </header>

    <div id="status-bar">
      <span class="legend"><span class="dot available"></span> Available</span>
      <span class="legend"><span class="dot held"></span> Held</span>
      <span class="legend"><span class="dot held-mine"></span> My Hold</span>
      <span class="legend"><span class="dot booked"></span> Booked</span>
      <span class="legend"><span class="dot selected"></span> Selected</span>
    </div>

    <div id="inventory-bar">
      <span>Available: <strong id="count-available">0</strong></span>
      <span>Held: <strong id="count-held">0</strong></span>
      <span>Booked: <strong id="count-booked">0</strong></span>
      <span>Total: <strong id="count-total">0</strong></span>
    </div>

    <div id="seat-map"></div>

    <div id="actions">
      <div id="selection-info">
        <span id="selected-count">0 seats selected</span>
      </div>
      <button id="btn-hold" disabled>Hold Selected Seats</button>
      <button id="btn-confirm" disabled>Confirm Booking</button>
      <button id="btn-release" disabled>Release Hold</button>
    </div>

    <div id="hold-info" class="hidden">
      <p>Hold active: <strong id="hold-seats"></strong></p>
      <p>Expires in: <strong id="hold-countdown"></strong></p>
    </div>

    <div id="messages"></div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
