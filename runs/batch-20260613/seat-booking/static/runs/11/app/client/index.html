<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seat Booking</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>🎭 Event Seat Booking</h1>
      <div id="connection" class="conn">connecting…</div>
    </header>

    <main>
      <section class="stage">STAGE</section>

      <div id="seatmap" class="seatmap" aria-label="Seat map"></div>

      <div class="legend">
        <span><i class="swatch available"></i> Available</span>
        <span><i class="swatch selected"></i> Selected</span>
        <span><i class="swatch held"></i> Held</span>
        <span><i class="swatch mine"></i> Your hold</span>
        <span><i class="swatch booked"></i> Booked</span>
      </div>

      <div class="inventory" id="inventory"></div>

      <div class="controls">
        <button id="holdBtn" disabled>Hold selected seats</button>
        <button id="confirmBtn" disabled>Confirm booking</button>
        <button id="releaseBtn" disabled>Release hold</button>
        <span id="countdown" class="countdown"></span>
      </div>

      <div id="status" class="status" role="status"></div>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
