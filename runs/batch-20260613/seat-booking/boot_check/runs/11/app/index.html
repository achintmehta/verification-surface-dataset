<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seat Booking</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>🎟️ Event Seat Booking</h1>
      <div id="status-bar" class="status-bar">
        <span id="connection" class="conn offline">connecting…</span>
        <span id="inventory" class="inventory"></span>
      </div>
    </header>

    <main>
      <div class="screen">SCREEN / STAGE</div>
      <div id="seat-map" class="seat-map"></div>

      <div class="legend">
        <span><i class="swatch available"></i>Available</span>
        <span><i class="swatch selected"></i>Selected</span>
        <span><i class="swatch held"></i>Held</span>
        <span><i class="swatch mine"></i>Your hold</span>
        <span><i class="swatch booked"></i>Booked</span>
      </div>

      <div class="controls">
        <div id="selection-info" class="selection-info">No seats selected.</div>
        <div class="buttons">
          <button id="hold-btn" disabled>Hold selected seats</button>
          <button id="confirm-btn" disabled>Confirm booking</button>
          <button id="release-btn" disabled>Release hold</button>
        </div>
        <div id="countdown" class="countdown"></div>
        <div id="message" class="message"></div>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
