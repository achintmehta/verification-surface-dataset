<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seat Booking</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>🎭 Seat Booking</h1>
        <p class="subtitle">Select seats, hold them, then confirm your booking.</p>
      </header>

      <div id="status-bar" class="status-bar hidden"></div>

      <section class="legend">
        <span class="legend-item"><span class="seat-demo available"></span> Available</span>
        <span class="legend-item"><span class="seat-demo held-own"></span> Your Hold</span>
        <span class="legend-item"><span class="seat-demo held-other"></span> Held by Other</span>
        <span class="legend-item"><span class="seat-demo booked"></span> Booked</span>
        <span class="legend-item"><span class="seat-demo selected"></span> Selected</span>
      </section>

      <div id="stage-label">STAGE</div>

      <div id="seat-map" class="seat-map">
        <div class="loading">Loading seat map…</div>
      </div>

      <div id="action-panel" class="action-panel">
        <div id="selection-info" class="selection-info hidden">
          <span id="selected-count">0</span> seat(s) selected
        </div>

        <div id="hold-panel" class="hold-panel hidden">
          <div class="hold-info">
            <span>Hold expires in: </span>
            <span id="countdown" class="countdown">--</span>
          </div>
          <div class="hold-actions">
            <button id="btn-confirm" class="btn btn-confirm">✓ Confirm Booking</button>
            <button id="btn-release" class="btn btn-release">✗ Release Hold</button>
          </div>
        </div>

        <button id="btn-hold" class="btn btn-hold hidden">
          🔒 Hold Selected Seats
        </button>
      </div>

      <div id="inventory" class="inventory">
        <span>Available: <strong id="inv-available">–</strong></span>
        <span>Held: <strong id="inv-held">–</strong></span>
        <span>Booked: <strong id="inv-booked">–</strong></span>
        <span>Total: <strong id="inv-total">–</strong></span>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
