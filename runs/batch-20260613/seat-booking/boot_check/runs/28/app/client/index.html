<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seat Booking</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .seat-map { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
    .row { display: flex; align-items: center; gap: 5px; }
    .row-label { width: 30px; font-weight: bold; }
    .seat { width: 40px; height: 40px; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; }
    .seat.available { background: #90EE90; }
    .seat.held { background: #FFD700; }
    .seat.booked { background: #FF6B6B; cursor: not-allowed; }
    .seat.selected { background: #4CAF50; color: white; }
    .controls { margin: 20px 0; }
    button { padding: 10px 20px; margin-right: 10px; }
    .status { margin: 10px 0; padding: 10px; background: #f0f0f0; }
    .hold-info { background: #fff3cd; padding: 10px; margin: 10px 0; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>Seat Booking System</h1>
  <div class="status" id="status">Loading seats...</div>
  
  <div class="controls">
    <button id="hold-btn" disabled>Hold Selected Seats</button>
    <button id="confirm-btn" disabled>Confirm Hold</button>
    <button id="release-btn" disabled>Release Hold</button>
    <button id="refresh-btn">Refresh</button>
  </div>

  <div id="hold-info" class="hold-info" style="display: none;"></div>

  <div class="seat-map" id="seat-map"></div>

  <script type="module" src="/main.js"></script>
</body>
</html>
