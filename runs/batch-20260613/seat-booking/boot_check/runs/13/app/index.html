<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seat Booking</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>🎟️ Seat Booking</h1>
        <div id="counts" class="counts"></div>
      </header>

      <main>
        <div class="screen">SCREEN / STAGE</div>
        <div id="seatmap" class="seatmap"></div>

        <div class="legend">
          <span><i class="seat available"></i> Available</span>
          <span><i class="seat held"></i> Held</span>
          <span><i class="seat mine"></i> Your selection / hold</span>
          <span><i class="seat booked"></i> Booked</span>
        </div>

        <div id="panel" class="panel">
          <div id="selection-info"></div>
          <div class="actions">
            <button id="hold-btn" disabled>Hold selected seats</button>
            <button id="confirm-btn" disabled>Confirm booking</button>
            <button id="release-btn" disabled>Release hold</button>
          </div>
          <div id="countdown" class="countdown"></div>
          <div id="message" class="message"></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
