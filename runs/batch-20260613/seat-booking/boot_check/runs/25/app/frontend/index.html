<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Booking</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <h1>🎭 Seat Booking</h1>

    <div id="inventory-bar">
      <span id="inv-available">Available: —</span>
      <span id="inv-held">Held: —</span>
      <span id="inv-booked">Booked: —</span>
      <span id="inv-total">Total: —</span>
      <span id="sse-status" class="sse-disconnected">● Disconnected</span>
    </div>

    <div id="seat-map"></div>

    <div id="actions">
      <div id="selection-info">Select seats to hold them</div>
      <button id="btn-hold" disabled>Hold Selected Seats</button>
      <button id="btn-confirm" disabled style="display:none">Confirm Booking</button>
      <button id="btn-release" disabled style="display:none">Release Hold</button>
      <div id="hold-timer" style="display:none">Hold expires in: <span id="timer-value">—</span></div>
    </div>

    <div id="messages"></div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
