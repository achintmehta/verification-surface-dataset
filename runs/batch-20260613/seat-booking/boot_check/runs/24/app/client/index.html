<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seat Booking</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>🎭 Seat Booking</h1>
      <div id="inventory" class="inventory"></div>
    </header>

    <div id="messages" class="messages"></div>

    <div class="stage-label">STAGE</div>
    <div id="seat-map" class="seat-map"></div>

    <div class="legend">
      <span class="legend-item"><span class="seat-dot available"></span> Available</span>
      <span class="legend-item"><span class="seat-dot held"></span> Held</span>
      <span class="legend-item"><span class="seat-dot mine"></span> Your Hold</span>
      <span class="legend-item"><span class="seat-dot booked"></span> Booked</span>
      <span class="legend-item"><span class="seat-dot selected"></span> Selected</span>
    </div>

    <div id="actions" class="actions">
      <div id="selection-info" class="selection-info"></div>
      <div id="hold-info" class="hold-info" style="display:none;">
        <p>Hold active! <span id="hold-timer"></span> remaining</p>
        <button id="btn-confirm" class="btn btn-confirm">Confirm Booking</button>
        <button id="btn-release" class="btn btn-release">Release Hold</button>
      </div>
      <button id="btn-hold" class="btn btn-hold" disabled>Hold Selected Seats</button>
    </div>

    <div id="connection-status" class="connection-status">Connecting...</div>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
