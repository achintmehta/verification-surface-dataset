<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week Calendar</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- Header / Navigation -->
    <header id="cal-header">
      <div class="nav-controls">
        <button id="btn-prev" aria-label="Previous week">&#8249;</button>
        <button id="btn-today">Today</button>
        <button id="btn-next" aria-label="Next week">&#8250;</button>
      </div>
      <h1 id="week-label"></h1>
    </header>

    <!-- Calendar container (scrollable) -->
    <div id="cal-container">

      <!-- Sticky day-header row (injected by JS above the body) -->
      <!-- id="days-header-row" inserted here by JS -->

      <!-- Body: time gutter + day columns side by side -->
      <div id="cal-body">
        <div id="time-gutter" aria-hidden="true"></div>
        <div id="days-row"></div>
      </div>

    </div>
  </div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal-box">
      <h2 id="modal-title">Event</h2>
      <form id="event-form" novalidate>
        <label for="f-title">Title</label>
        <input id="f-title" type="text" required placeholder="Event title" autocomplete="off" />

        <label for="f-start">Start</label>
        <input id="f-start" type="datetime-local" required />

        <label for="f-end">End</label>
        <input id="f-end" type="datetime-local" required />

        <p id="form-error" class="form-error hidden"></p>

        <div class="form-actions">
          <button type="submit" id="btn-save">Save</button>
          <button type="button" id="btn-delete" class="danger hidden">Delete</button>
          <button type="button" id="btn-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
