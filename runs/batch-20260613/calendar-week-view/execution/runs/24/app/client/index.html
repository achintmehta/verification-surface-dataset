<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week Calendar</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <header class="calendar-header">
      <div class="nav-controls">
        <button id="btn-prev" title="Previous week">&lsaquo;</button>
        <button id="btn-today">Today</button>
        <button id="btn-next" title="Next week">&rsaquo;</button>
      </div>
      <h1 id="week-title"></h1>
    </header>
    <div class="calendar-container">
      <div class="time-gutter" id="time-gutter"></div>
      <div class="days-container" id="days-container"></div>
    </div>
  </div>

  <!-- Event Form Modal -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal" id="event-modal">
      <h2 id="modal-title">Create Event</h2>
      <form id="event-form">
        <input type="hidden" id="event-id" />
        <div class="form-group">
          <label for="event-title">Title</label>
          <input type="text" id="event-title" required placeholder="Event title" />
        </div>
        <div class="form-group">
          <label for="event-start">Start</label>
          <input type="datetime-local" id="event-start" required />
        </div>
        <div class="form-group">
          <label for="event-end">End</label>
          <input type="datetime-local" id="event-end" required />
        </div>
        <div class="form-error" id="form-error"></div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="btn-save">Save</button>
          <button type="button" class="btn-secondary" id="btn-cancel">Cancel</button>
          <button type="button" class="btn-danger" id="btn-delete" style="display:none;">Delete</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
