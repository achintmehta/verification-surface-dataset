<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week Calendar</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="nav-controls">
        <button id="btn-prev" title="Previous week">&larr; Prev</button>
        <button id="btn-today">Today</button>
        <button id="btn-next" title="Next week">Next &rarr;</button>
      </div>
      <h1 id="week-title"></h1>
    </header>
    <div id="calendar-container">
      <div id="time-gutter"></div>
      <div id="days-container"></div>
    </div>
  </div>

  <!-- Event Form Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal" class="modal">
      <h2 id="modal-title">Create Event</h2>
      <form id="event-form">
        <div class="form-group">
          <label for="input-title">Title</label>
          <input type="text" id="input-title" required />
        </div>
        <div class="form-group">
          <label for="input-start">Start</label>
          <input type="datetime-local" id="input-start" required />
        </div>
        <div class="form-group">
          <label for="input-end">End</label>
          <input type="datetime-local" id="input-end" required />
        </div>
        <div id="form-error" class="form-error hidden"></div>
        <div class="form-actions">
          <button type="submit" id="btn-save">Save</button>
          <button type="button" id="btn-delete" class="btn-danger hidden">Delete</button>
          <button type="button" id="btn-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
