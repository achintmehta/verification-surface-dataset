<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week Calendar</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <div class="header">
      <button id="prev-week">Previous</button>
      <button id="today">Today</button>
      <button id="next-week">Next</button>
      <span id="week-range"></span>
    </div>
    <div id="calendar-container">
      <div id="time-axis"></div>
      <div id="days-container"></div>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div id="event-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title">Create Event</h2>
      <form id="event-form">
        <input type="hidden" id="event-id">
        <div>
          <label>Title</label>
          <input type="text" id="event-title" required>
        </div>
        <div>
          <label>Start</label>
          <input type="datetime-local" id="event-start" required>
        </div>
        <div>
          <label>End</label>
          <input type="datetime-local" id="event-end" required>
        </div>
        <div class="modal-actions">
          <button type="button" id="delete-btn" style="display:none;">Delete</button>
          <button type="button" id="cancel-btn">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
