<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week Calendar</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="nav-buttons">
        <button id="btn-prev" title="Previous week">&larr; Prev</button>
        <button id="btn-today">Today</button>
        <button id="btn-next" title="Next week">Next &rarr;</button>
      </div>
      <h1 id="week-title"></h1>
    </header>
    <div class="calendar-container">
      <div class="calendar-scroll">
        <div class="time-gutter" id="time-gutter"></div>
        <div class="days-grid" id="days-grid"></div>
      </div>
    </div>
  </div>

  <!-- Event Form Modal -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal" id="event-modal">
      <h2 id="modal-title">Create Event</h2>
      <form id="event-form">
        <input type="hidden" id="form-event-id" />
        <div class="form-group">
          <label for="form-title">Title</label>
          <input type="text" id="form-title" required placeholder="Event title" />
        </div>
        <div class="form-group">
          <label for="form-date">Date</label>
          <input type="date" id="form-date" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="form-start">Start Time</label>
            <input type="time" id="form-start" required />
          </div>
          <div class="form-group">
            <label for="form-end">End Time</label>
            <input type="time" id="form-end" required />
          </div>
        </div>
        <div class="form-error" id="form-error" style="display:none;"></div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="btn-save">Save</button>
          <button type="button" class="btn-secondary" id="btn-cancel">Cancel</button>
          <button type="button" class="btn-danger" id="btn-delete" style="display:none;">Delete</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
