<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week Calendar</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- Top navigation bar -->
    <header id="cal-header">
      <div class="nav-controls">
        <button id="btn-prev" aria-label="Previous week">&#8249;</button>
        <button id="btn-today">Today</button>
        <button id="btn-next" aria-label="Next week">&#8250;</button>
      </div>
      <h1 id="week-label"></h1>
    </header>

    <!-- Calendar grid -->
    <div id="calendar-container">

      <!-- Sticky day-header row (gutter spacer + 7 day headers) -->
      <div id="sticky-header-row">
        <div class="gutter-spacer"></div>
        <!-- Day header cells injected by JS -->
      </div>

      <!-- Scrollable area: time gutter + day bodies -->
      <div id="scroll-area">
        <div id="time-gutter">
          <!-- Hour labels injected by JS -->
        </div>
        <div id="day-bodies-row">
          <!-- Day body columns injected by JS -->
        </div>
      </div>

    </div>
  </div>

  <!-- Create / Edit modal -->
  <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal">
      <h2 id="modal-title">New Event</h2>
      <form id="event-form" novalidate>
        <input type="hidden" id="event-id" />
        <div class="form-group">
          <label for="event-title">Title</label>
          <input type="text" id="event-title" placeholder="Event title" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="event-start">Start</label>
          <input type="datetime-local" id="event-start" required />
        </div>
        <div class="form-group">
          <label for="event-end">End</label>
          <input type="datetime-local" id="event-end" required />
        </div>
        <div id="form-error" class="form-error hidden"></div>
        <div class="form-actions">
          <button type="submit" id="btn-save">Save</button>
          <button type="button" id="btn-delete" class="hidden">Delete</button>
          <button type="button" id="btn-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
