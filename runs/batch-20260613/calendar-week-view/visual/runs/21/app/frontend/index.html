<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week Calendar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="nav-buttons">
        <button id="btn-prev">&larr; Previous</button>
        <button id="btn-today">Today</button>
        <button id="btn-next">Next &rarr;</button>
      </div>
      <h1 id="week-title"></h1>
    </header>

    <div class="calendar-container">
      <div class="time-gutter" id="time-gutter"></div>
      <div class="days-container" id="days-container"></div>
    </div>
  </div>

  <!-- Event Form Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="event-modal">
      <h2 id="modal-title">Create Event</h2>
      <form id="event-form">
        <div class="form-group">
          <label for="event-title">Title</label>
          <input type="text" id="event-title" required placeholder="Event title" />
        </div>
        <div class="form-group">
          <label for="event-start">Start</label>
          <input type="datetime-local" id="event-start" required />
        </div>
        <div class="form-group">
          <label for="event-end">End</label>
          <input type="datetime-local" id="event-end" required />
        </div>
        <div class="form-error" id="form-error"></div>
        <div class="form-actions">
          <button type="submit" id="btn-save">Save</button>
          <button type="button" id="btn-delete" class="btn-danger" style="display:none;">Delete</button>
          <button type="button" id="btn-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
