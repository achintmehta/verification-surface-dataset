<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week Calendar</title>
  <script type="module" crossorigin src="/assets/index-n5RkUZSk.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-dAJV7XFE.css">
</head>
<body>
  <div id="app">
    <header id="cal-header">
      <div class="header-nav">
        <button id="btn-prev" class="nav-btn" title="Previous week">&#8249;</button>
        <button id="btn-today" class="nav-btn today-btn">Today</button>
        <button id="btn-next" class="nav-btn" title="Next week">&#8250;</button>
      </div>
      <h1 id="week-label"></h1>
    </header>

    <div id="calendar-container">
      <!-- Day headers row -->
      <div id="day-headers">
        <div class="time-gutter-header"></div>
        <!-- Day header cells injected by JS -->
      </div>

      <!-- Scrollable grid area -->
      <div id="grid-scroll">
        <div id="grid-inner">
          <!-- Time gutter -->
          <div id="time-gutter">
            <!-- Hour labels injected by JS -->
          </div>
          <!-- Day columns -->
          <div id="day-columns">
            <!-- 7 day columns injected by JS -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <button id="modal-close" class="modal-close-btn" title="Close">&times;</button>
      <h2 id="modal-title">New Event</h2>
      <form id="event-form">
        <input type="hidden" id="event-id" />
        <div class="form-group">
          <label for="event-title">Title</label>
          <input type="text" id="event-title" placeholder="Event title" required autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="event-start">Start</label>
          <input type="datetime-local" id="event-start" required />
        </div>
        <div class="form-group">
          <label for="event-end">End</label>
          <input type="datetime-local" id="event-end" required />
        </div>
        <div id="form-error" class="form-error hidden"></div>
        <div class="form-actions">
          <button type="submit" id="btn-save" class="btn-primary">Save</button>
          <button type="button" id="btn-delete" class="btn-danger hidden">Delete</button>
          <button type="button" id="btn-cancel" class="btn-secondary">Cancel</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
