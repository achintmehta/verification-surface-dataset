<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week Calendar</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">

    <!-- Top navigation header -->
    <header id="calendar-header">
      <div class="header-nav">
        <button id="btn-prev" class="nav-btn" title="Previous week">&#8249;</button>
        <button id="btn-today" class="nav-btn today-btn">Today</button>
        <button id="btn-next" class="nav-btn" title="Next week">&#8250;</button>
      </div>
      <h1 id="week-label"></h1>
    </header>

    <div id="calendar-container">

      <!-- Sticky day-header row (gutter corner + 7 day headers) -->
      <div id="day-headers-row">
        <div class="gutter-corner"></div>
        <div id="day-headers"></div>
      </div>

      <!-- Scrollable body: time gutter + day columns -->
      <div id="calendar-body">

        <!-- Time gutter (scrolls in sync with day columns) -->
        <div id="time-gutter">
          <div id="time-gutter-inner"></div>
        </div>

        <!-- Day columns scroll area -->
        <div id="day-columns-scroll">
          <div id="day-columns"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Event modal -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <button id="modal-close" class="modal-close-btn" aria-label="Close">&times;</button>
      <h2 id="modal-title">New Event</h2>
      <form id="event-form" novalidate>
        <div class="form-group">
          <label for="input-title">Title</label>
          <input type="text" id="input-title" placeholder="Event title" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="input-start">Start</label>
          <input type="datetime-local" id="input-start" />
        </div>
        <div class="form-group">
          <label for="input-end">End</label>
          <input type="datetime-local" id="input-end" />
        </div>
        <div id="form-error" class="form-error hidden"></div>
        <div class="form-actions">
          <button type="submit" id="btn-save" class="btn-primary">Save</button>
          <button type="button" id="btn-delete" class="btn-danger hidden">Delete</button>
          <button type="button" id="btn-cancel" class="btn-secondary">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
