<!DOCTYPE html>
<html>
<head><title>Seed Events</title></head>
<body>
<h1>Seeding test events...</h1>
<pre id="log"></pre>
<script>
async function seed() {
  const log = document.getElementById('log');
  
  // Get current week's Monday
  const now = new Date();
  const day = now.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const monday = new Date(now);
  monday.setDate(now.getDate() + diff);
  monday.setHours(0,0,0,0);
  
  function dayAt(offset, h, m) {
    const d = new Date(monday);
    d.setDate(d.getDate() + offset);
    d.setHours(h, m, 0, 0);
    return d.toISOString();
  }
  
  const events = [
    // Monday: 3 overlapping events at 9-10
    { title: "Meeting A", start_at: dayAt(0, 9, 0), end_at: dayAt(0, 10, 0) },
    { title: "Meeting B", start_at: dayAt(0, 9, 0), end_at: dayAt(0, 10, 0) },
    { title: "Meeting C", start_at: dayAt(0, 9, 0), end_at: dayAt(0, 10, 0) },
    
    // Monday: non-overlapping event later
    { title: "Lunch", start_at: dayAt(0, 12, 0), end_at: dayAt(0, 13, 0) },
    
    // Tuesday: partial overlap chain
    { title: "Chain 1", start_at: dayAt(1, 9, 0), end_at: dayAt(1, 11, 0) },
    { title: "Chain 2", start_at: dayAt(1, 10, 0), end_at: dayAt(1, 12, 0) },
    { title: "Chain 3", start_at: dayAt(1, 11, 30), end_at: dayAt(1, 13, 0) },
    
    // Wednesday: event ending at midnight (24:00)
    { title: "Late Night", start_at: dayAt(2, 22, 0), end_at: dayAt(3, 0, 0) },
    
    // Thursday (today): single event
    { title: "Standup", start_at: dayAt(3, 9, 30), end_at: dayAt(3, 9, 45) },
    
    // Friday: multiple overlaps
    { title: "Alpha", start_at: dayAt(4, 14, 0), end_at: dayAt(4, 16, 0) },
    { title: "Beta", start_at: dayAt(4, 14, 30), end_at: dayAt(4, 15, 30) },
    { title: "Gamma", start_at: dayAt(4, 15, 0), end_at: dayAt(4, 17, 0) },
    { title: "Delta", start_at: dayAt(4, 16, 30), end_at: dayAt(4, 18, 0) },
  ];
  
  for (const ev of events) {
    try {
      const res = await fetch('/api/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(ev)
      });
      const data = await res.json();
      log.textContent += `Created: ${ev.title} -> ${JSON.stringify(data)}\n`;
    } catch(e) {
      log.textContent += `Error: ${ev.title} -> ${e.message}\n`;
    }
  }
  log.textContent += '\nDone! Go back to the calendar.';
}
seed();
</script>
</body>
</html>
