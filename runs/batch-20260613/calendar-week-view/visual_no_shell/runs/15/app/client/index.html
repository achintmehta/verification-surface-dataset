<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week Calendar</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="nav">
        <button id="prevBtn" title="Previous week">&#8592;</button>
        <button id="todayBtn">Today</button>
        <button id="nextBtn" title="Next week">&#8594;</button>
      </div>
      <h1 id="weekLabel">Week</h1>
    </header>
    <div class="calendar" id="calendar"></div>
  </div>

  <!-- Event form modal -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal">
      <h2 id="modalTitle">New event</h2>
      <form id="eventForm">
        <label>
          Title
          <input type="text" id="fTitle" autocomplete="off" />
        </label>
        <label>
          Date
          <input type="date" id="fDate" />
        </label>
        <div class="time-row">
          <label>
            Start
            <input type="time" id="fStart" step="60" />
          </label>
          <label>
            End
            <input type="time" id="fEnd" step="60" />
          </label>
        </div>
        <p class="form-error" id="formError" hidden></p>
        <div class="modal-actions">
          <button type="button" id="deleteBtn" class="danger" hidden>Delete</button>
          <span class="spacer"></span>
          <button type="button" id="cancelBtn">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
