<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week Calendar</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- Navigation bar -->
    <header id="nav-bar">
      <button id="btn-prev" class="nav-btn" aria-label="Previous week">&#8592; Prev</button>
      <button id="btn-today" class="nav-btn" aria-label="Go to today">Today</button>
      <button id="btn-next" class="nav-btn" aria-label="Next week">Next &#8594;</button>
      <h1 id="week-label"></h1>
    </header>

    <!-- Calendar grid -->
    <div id="calendar-container">
      <!-- Time axis (left column) -->
      <div id="time-axis">
        <div class="time-axis-header"></div>
        <div id="time-axis-labels"></div>
      </div>

      <!-- Day columns -->
      <div id="days-grid">
        <!-- Populated by JS -->
      </div>
    </div>
  </div>

  <!-- Modal overlay for create/edit form -->
  <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal">
      <h2 id="modal-title">New Event</h2>
      <form id="event-form" novalidate>
        <div class="form-group">
          <label for="field-title">Title</label>
          <input type="text" id="field-title" name="title" required placeholder="Event title" />
        </div>
        <div class="form-group">
          <label for="field-start">Start</label>
          <input type="datetime-local" id="field-start" name="start_at" required />
        </div>
        <div class="form-group">
          <label for="field-end">End</label>
          <input type="datetime-local" id="field-end" name="end_at" required />
        </div>
        <div id="form-error" class="form-error hidden"></div>
        <div class="form-actions">
          <button type="submit" id="btn-save" class="btn-primary">Save</button>
          <button type="button" id="btn-delete" class="btn-danger hidden">Delete</button>
          <button type="button" id="btn-cancel" class="btn-secondary">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
