<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week Calendar</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- Navigation header -->
    <header class="calendar-header">
      <div class="nav-buttons">
        <button id="btn-prev" title="Previous week">&larr; Prev</button>
        <button id="btn-today">Today</button>
        <button id="btn-next" title="Next week">Next &rarr;</button>
      </div>
      <h1 id="week-title"></h1>
    </header>

    <!-- Week grid -->
    <div class="calendar-container">
      <!-- Time gutter -->
      <div class="time-gutter" id="time-gutter"></div>
      <!-- Day columns -->
      <div class="days-container" id="days-container"></div>
    </div>

    <!-- Event form modal -->
    <div class="modal-overlay" id="modal-overlay" style="display:none;">
      <div class="modal" id="event-modal">
        <h2 id="modal-title">Create Event</h2>
        <form id="event-form">
          <input type="hidden" id="event-id" value="" />
          <div class="form-group">
            <label for="event-title">Title</label>
            <input type="text" id="event-title" required placeholder="Event title" />
          </div>
          <div class="form-group">
            <label for="event-start">Start</label>
            <input type="datetime-local" id="event-start" required />
          </div>
          <div class="form-group">
            <label for="event-end">End</label>
            <input type="datetime-local" id="event-end" required />
          </div>
          <div class="form-actions">
            <button type="submit" id="btn-save">Save</button>
            <button type="button" id="btn-delete" style="display:none;">Delete</button>
            <button type="button" id="btn-cancel">Cancel</button>
          </div>
          <p class="form-error" id="form-error"></p>
        </form>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
