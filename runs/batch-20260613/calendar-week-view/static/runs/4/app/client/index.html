<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week Calendar</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Navigation bar -->
      <header id="nav-bar">
        <button id="btn-prev" class="nav-btn" aria-label="Previous week">&#8592; Prev</button>
        <button id="btn-today" class="nav-btn" aria-label="Go to today">Today</button>
        <button id="btn-next" class="nav-btn" aria-label="Next week">Next &#8594;</button>
        <h1 id="week-label"></h1>
      </header>

      <!-- Main calendar grid -->
      <div id="calendar-container">
        <!-- Time axis (left column) -->
        <div id="time-axis" aria-hidden="true"></div>

        <!-- Day columns wrapper -->
        <div id="days-wrapper">
          <!-- Day header row -->
          <div id="day-headers"></div>
          <!-- Scrollable grid body -->
          <div id="grid-scroll">
            <div id="grid-body">
              <!-- Hour lines (background) -->
              <div id="hour-lines" aria-hidden="true"></div>
              <!-- Day columns (events rendered here) -->
              <div id="day-columns"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal overlay for create / edit forms -->
    <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div id="modal-box">
        <h2 id="modal-title">Event</h2>
        <form id="event-form" novalidate>
          <label for="field-title">Title</label>
          <input id="field-title" type="text" name="title" required autocomplete="off" />

          <label for="field-start">Start</label>
          <input id="field-start" type="datetime-local" name="start_at" required />

          <label for="field-end">End</label>
          <input id="field-end" type="datetime-local" name="end_at" required />

          <div id="form-error" class="hidden" role="alert"></div>

          <div id="form-actions">
            <button type="submit" id="btn-save">Save</button>
            <button type="button" id="btn-delete" class="hidden danger">Delete</button>
            <button type="button" id="btn-cancel">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
