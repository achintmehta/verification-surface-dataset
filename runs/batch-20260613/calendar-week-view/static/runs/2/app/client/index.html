<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week Calendar</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <button id="btn-prev" aria-label="Previous week">&#8592; Prev</button>
      <h1 id="week-label"></h1>
      <button id="btn-today">Today</button>
      <button id="btn-next" aria-label="Next week">Next &#8594;</button>
    </header>

    <div id="calendar-container">
      <!-- Day headers row -->
      <div id="header-row">
        <div class="time-gutter-header"></div>
        <div id="day-headers"></div>
      </div>

      <!-- Scrollable body -->
      <div id="body-scroll">
        <div id="body-inner">
          <!-- Time gutter -->
          <div id="time-gutter"></div>
          <!-- Day columns -->
          <div id="day-columns"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal">
      <h2 id="modal-title">Event</h2>
      <form id="event-form" novalidate>
        <label for="field-title">Title</label>
        <input id="field-title" type="text" required placeholder="Event title" autocomplete="off" />

        <label for="field-start">Start</label>
        <input id="field-start" type="datetime-local" required />

        <label for="field-end">End</label>
        <input id="field-end" type="datetime-local" required />

        <p id="form-error" class="form-error hidden"></p>

        <div class="modal-actions">
          <button type="submit" id="btn-save">Save</button>
          <button type="button" id="btn-delete" class="hidden danger">Delete</button>
          <button type="button" id="btn-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
