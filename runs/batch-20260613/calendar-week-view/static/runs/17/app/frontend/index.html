<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week Calendar</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header>
      <button id="prev-week">&lt; Prev</button>
      <button id="today">Today</button>
      <button id="next-week">Next &gt;</button>
      <h2 id="current-week-label"></h2>
    </header>
    <div class="calendar-container">
      <div class="calendar-header" id="calendar-header">
        <div class="time-axis-header"></div>
        <!-- Day headers will be generated here -->
      </div>
      <div class="calendar-body">
        <div class="time-axis" id="time-axis">
          <!-- Hour labels will be generated here -->
        </div>
        <div class="week-grid" id="week-grid">
          <!-- Day columns will be generated here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Event Modal -->
  <div id="event-modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-title">Create Event</h3>
      <form id="event-form">
        <input type="hidden" id="event-id">
        <div class="form-group">
          <label for="event-title">Title</label>
          <input type="text" id="event-title" required>
        </div>
        <div class="form-group">
          <label for="event-start">Start</label>
          <input type="datetime-local" id="event-start" required>
        </div>
        <div class="form-group">
          <label for="event-end">End</label>
          <input type="datetime-local" id="event-end" required>
        </div>
        <div class="form-actions">
          <button type="submit" id="save-btn">Save</button>
          <button type="button" id="delete-btn" class="hidden">Delete</button>
          <button type="button" id="cancel-btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
