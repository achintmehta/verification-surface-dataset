<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week Calendar</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="nav-buttons">
        <button id="btn-prev" title="Previous week">&larr; Prev</button>
        <button id="btn-today">Today</button>
        <button id="btn-next" title="Next week">Next &rarr;</button>
      </div>
      <h1 id="week-title"></h1>
    </header>
    <div class="calendar-container">
      <div class="time-gutter" id="time-gutter"></div>
      <div class="week-grid" id="week-grid"></div>
    </div>
  </div>

  <!-- Event Form Modal -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal" id="event-modal">
      <h2 id="modal-title">Create Event</h2>
      <form id="event-form">
        <input type="hidden" id="event-id" />
        <div class="form-group">
          <label for="event-title-input">Title</label>
          <input type="text" id="event-title-input" required placeholder="Event title" />
        </div>
        <div class="form-group">
          <label for="event-date">Date</label>
          <input type="date" id="event-date" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="event-start-time">Start Time</label>
            <input type="time" id="event-start-time" required step="60" />
          </div>
          <div class="form-group">
            <label for="event-end-time">End Time</label>
            <input type="time" id="event-end-time" required step="60" />
          </div>
        </div>
        <div class="form-group checkbox-group" id="ends-midnight-group" style="display:none;">
          <label>
            <input type="checkbox" id="event-ends-midnight" />
            Ends at midnight (next day)
          </label>
        </div>
        <div id="form-error" class="form-error" style="display:none;"></div>
        <div class="form-actions">
          <button type="submit" id="btn-save">Save</button>
          <button type="button" id="btn-delete" style="display:none;">Delete</button>
          <button type="button" id="btn-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
