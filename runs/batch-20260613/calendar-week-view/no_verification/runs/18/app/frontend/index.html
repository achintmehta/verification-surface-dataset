<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week Calendar</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="header">
        <div class="nav">
          <button id="prev-week">&lt; Prev</button>
          <button id="today">Today</button>
          <button id="next-week">Next &gt;</button>
        </div>
        <h2 id="current-week-label"></h2>
      </header>
      
      <div class="calendar-container">
        <div class="time-axis" id="time-axis">
          <!-- Hours will be generated here -->
        </div>
        <div class="week-grid" id="week-grid">
          <!-- Day columns will be generated here -->
        </div>
      </div>
    </div>

    <!-- Event Modal -->
    <div id="event-modal" class="modal hidden">
      <div class="modal-content">
        <h3 id="modal-title">Create Event</h3>
        <form id="event-form">
          <input type="hidden" id="event-id" />
          <div class="form-group">
            <label for="event-title">Title</label>
            <input type="text" id="event-title" required />
          </div>
          <div class="form-group">
            <label for="event-start">Start</label>
            <input type="datetime-local" id="event-start" required />
          </div>
          <div class="form-group">
            <label for="event-end">End</label>
            <input type="datetime-local" id="event-end" required />
          </div>
          <div class="form-actions">
            <button type="button" id="btn-delete" class="btn-danger hidden">Delete</button>
            <button type="button" id="btn-cancel">Cancel</button>
            <button type="submit" id="btn-save" class="btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
