<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week Calendar</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <button id="btn-prev" title="Previous week">&#9664; Prev</button>
      <button id="btn-today">Today</button>
      <button id="btn-next" title="Next week">Next &#9654;</button>
      <h1 id="week-title"></h1>
    </header>
    <div class="calendar-container">
      <div class="time-gutter" id="time-gutter"></div>
      <div class="week-grid" id="week-grid"></div>
    </div>
  </div>

  <!-- Event Form Modal -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal" id="event-modal">
      <h2 id="modal-title">New Event</h2>
      <form id="event-form">
        <label for="input-title">Title</label>
        <input type="text" id="input-title" required placeholder="Event title" />

        <label for="input-start">Start</label>
        <input type="datetime-local" id="input-start" required />

        <label for="input-end">End</label>
        <input type="datetime-local" id="input-end" required />

        <div id="form-error" class="form-error" style="display:none;"></div>

        <div class="modal-actions">
          <button type="submit" id="btn-save">Save</button>
          <button type="button" id="btn-delete" style="display:none;">Delete</button>
          <button type="button" id="btn-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
