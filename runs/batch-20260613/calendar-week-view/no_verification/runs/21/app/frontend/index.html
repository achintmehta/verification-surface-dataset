<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week Calendar</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Header with navigation -->
    <header id="calendar-header">
      <div class="nav-controls">
        <button id="btn-prev" title="Previous week">&larr; Prev</button>
        <button id="btn-today">Today</button>
        <button id="btn-next" title="Next week">Next &rarr;</button>
      </div>
      <h1 id="week-title"></h1>
    </header>

    <!-- Week grid -->
    <div id="calendar-container">
      <!-- Time gutter -->
      <div id="time-gutter"></div>
      <!-- Day columns container -->
      <div id="days-container">
        <!-- Day headers row -->
        <div id="day-headers"></div>
        <!-- Day columns with events -->
        <div id="day-columns"></div>
      </div>
    </div>

    <!-- Event form modal -->
    <div id="event-modal" class="modal hidden">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <h2 id="modal-title">Create Event</h2>
        <form id="event-form">
          <input type="hidden" id="event-id" />
          <div class="form-group">
            <label for="event-title">Title</label>
            <input type="text" id="event-title" required placeholder="Event title" />
          </div>
          <div class="form-group">
            <label for="event-start">Start</label>
            <input type="datetime-local" id="event-start" required />
          </div>
          <div class="form-group">
            <label for="event-end">End</label>
            <input type="datetime-local" id="event-end" required />
          </div>
          <div id="form-error" class="form-error hidden"></div>
          <div class="form-actions">
            <button type="submit" id="btn-save">Save</button>
            <button type="button" id="btn-delete" class="btn-danger hidden">Delete</button>
            <button type="button" id="btn-cancel">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
