<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Label Assignment — Visual Demo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #eef2f7;
      color: #172033;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem 2rem;
      background: linear-gradient(135deg, #172033, #334155);
      color: white;
      box-shadow: 0 2px 16px rgba(15,23,42,0.2);
    }
    h1, h2, p { margin: 0; }
    .topbar p { color: #cbd5e1; margin-top: 0.35rem; }
    .status {
      white-space: nowrap;
      border-radius: 999px;
      padding: 0.45rem 0.8rem;
      background: #16a34a;
      color: white;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      background: #f1f5f9;
      border-bottom: 1px solid #cbd5e1;
    }
    .filter-label-text { font-size: 0.85rem; font-weight: 600; color: #475569; margin-right: 0.25rem; }
    .filter-chip {
      border: 2px solid var(--chip-color, #94a3b8);
      border-radius: 999px;
      padding: 0.25rem 0.75rem;
      background: transparent;
      color: #172033;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .manage-labels-btn {
      margin-left: auto;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0.3rem 0.75rem;
      background: white;
      color: #334155;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(260px, 1fr));
      gap: 1rem;
      padding: 1.25rem;
      align-items: start;
      filter: blur(1px);
      opacity: 0.4;
    }
    .column {
      background: #dbe4ef;
      border: 1px solid #cbd5e1;
      border-radius: 18px;
      padding: 1rem;
      min-height: 300px;
    }
    .column h2 { font-size: 1.05rem; margin-bottom: 0.8rem; color: #0f172a; }
    .add-card { display: flex; gap: 0.45rem; margin-bottom: 0.85rem; }
    .add-card input { width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; padding: 0.65rem 0.7rem; font: inherit; }
    .add-card button { border: none; border-radius: 10px; padding: 0.65rem 0.85rem; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 0.75rem 0.85rem 0.55rem;
      margin-bottom: 0.65rem;
      border: 1px solid #e2e8f0;
      box-shadow: 0 6px 18px rgba(15,23,42,0.08);
      position: relative;
    }
    .card-text { margin-bottom: 0.45rem; }
    .card-labels { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .label-chip {
      display: inline-block;
      border-radius: 999px;
      padding: 0.15rem 0.55rem;
      font-size: 0.72rem;
      font-weight: 700;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }

    /* ── Card label modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .modal {
      background: white;
      border-radius: 16px;
      padding: 1.5rem;
      width: min(380px, 95vw);
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(15,23,42,0.25);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .modal-header h3 { font-size: 1rem; font-weight: 700; margin: 0; }
    .modal-close {
      border: none;
      background: transparent;
      font-size: 1.1rem;
      cursor: pointer;
      color: #64748b;
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
    }
    .card-label-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .card-label-row {
      padding: 0.4rem 0.5rem;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }
    .card-label-row label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .card-label-row input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
    .label-swatch {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<header class="topbar">
  <div>
    <h1>Collaborative Kanban</h1>
    <p>Drag cards between columns. Updates are broadcast in real time with SSE.</p>
  </div>
  <div class="status">Live</div>
</header>

<div class="filter-bar">
  <span class="filter-label-text">Filter:</span>
  <button class="filter-chip" style="--chip-color:#ef4444">Bug</button>
  <button class="filter-chip" style="--chip-color:#3b82f6">Feature</button>
  <button class="filter-chip" style="--chip-color:#f97316">Urgent</button>
  <button class="filter-chip" style="--chip-color:#8b5cf6">Design</button>
  <button class="manage-labels-btn">⚙ Labels</button>
</div>

<main class="board">
  <section class="column">
    <h2>To Do</h2>
    <form class="add-card"><input type="text" placeholder="Add a card…" /><button type="button">Add</button></form>
    <div class="cards">
      <article class="card">
        <div class="card-text">Fix login redirect bug on Safari</div>
        <div class="card-labels">
          <span class="label-chip" style="background:#ef4444">Bug</span>
          <span class="label-chip" style="background:#f97316">Urgent</span>
        </div>
      </article>
    </div>
  </section>
  <section class="column">
    <h2>In Progress</h2>
    <form class="add-card"><input type="text" placeholder="Add a card…" /><button type="button">Add</button></form>
  </section>
  <section class="column">
    <h2>Done</h2>
    <form class="add-card"><input type="text" placeholder="Add a card…" /><button type="button">Add</button></form>
  </section>
</main>

<!-- Card label assignment modal — shown open -->
<div class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3>Labels for card</h3>
      <button class="modal-close">✕</button>
    </div>
    <ul class="card-label-list">
      <li class="card-label-row">
        <label>
          <input type="checkbox" checked />
          <span class="label-swatch" style="background:#ef4444"></span>
          Bug
        </label>
      </li>
      <li class="card-label-row">
        <label>
          <input type="checkbox" />
          <span class="label-swatch" style="background:#8b5cf6"></span>
          Design
        </label>
      </li>
      <li class="card-label-row">
        <label>
          <input type="checkbox" />
          <span class="label-swatch" style="background:#3b82f6"></span>
          Feature
        </label>
      </li>
      <li class="card-label-row">
        <label>
          <input type="checkbox" checked />
          <span class="label-swatch" style="background:#f97316"></span>
          Urgent
        </label>
      </li>
    </ul>
  </div>
</div>

</body>
</html>
