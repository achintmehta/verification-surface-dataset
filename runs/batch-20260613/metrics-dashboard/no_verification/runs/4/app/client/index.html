<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metrics Dashboard</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
  <script>
    // Apply persisted theme before first paint to avoid flash of wrong theme.
    // This is a synchronous-looking async IIFE; the fetch is fast (localhost).
    // We use a regular script (not module) so it runs as early as possible.
    (function () {
      // Optimistically check sessionStorage for a cached theme value
      // so repeat loads are instant.
      try {
        var cached = sessionStorage.getItem('dashboard-theme');
        if (cached === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <div id="app">
    <header class="site-header">
      <div class="header-inner">
        <div class="header-brand">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
          <span class="brand-name">Metrics Dashboard</span>
        </div>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle theme">
          <span class="theme-icon theme-icon--light" aria-hidden="true">
            <!-- Sun icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </span>
          <span class="theme-icon theme-icon--dark" aria-hidden="true">
            <!-- Moon icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </span>
        </button>
      </div>
    </header>

    <main class="dashboard" id="dashboard">
      <!-- Error banner (hidden by default) -->
      <div id="error-banner" class="error-banner" role="alert" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="error-message">Unable to reach the server. Please ensure the backend is running.</span>
      </div>

      <!-- Loading overlay -->
      <div id="loading-overlay" class="loading-overlay" aria-live="polite" aria-label="Loading dashboard data">
        <div class="spinner"></div>
        <p>Loading dashboard…</p>
      </div>

      <!-- ── Stat Cards ─────────────────────────────────────────────── -->
      <section class="stat-cards" aria-label="Summary statistics">
        <div class="stat-card" id="card-visitors">
          <div class="stat-card__label">Total Visitors</div>
          <div class="stat-card__value" id="stat-visitors">—</div>
          <div class="stat-card__sub" id="stat-visitors-sub"></div>
        </div>
        <div class="stat-card" id="card-revenue">
          <div class="stat-card__label">Total Revenue</div>
          <div class="stat-card__value" id="stat-revenue">—</div>
          <div class="stat-card__sub" id="stat-revenue-sub"></div>
        </div>
        <div class="stat-card" id="card-bestday">
          <div class="stat-card__label">Best Day (Visitors)</div>
          <div class="stat-card__value" id="stat-bestday">—</div>
          <div class="stat-card__sub" id="stat-bestday-sub"></div>
        </div>
        <div class="stat-card" id="card-trend">
          <div class="stat-card__label">7-Day Revenue Trend</div>
          <div class="stat-card__value" id="stat-trend">—</div>
          <div class="stat-card__sub" id="stat-trend-sub">vs prior 7 days</div>
        </div>
      </section>

      <!-- ── Body: Chart + Categories ──────────────────────────────── -->
      <div class="dashboard-body">
        <!-- Time-series chart -->
        <section class="panel panel--chart" aria-label="30-day time series">
          <h2 class="panel__title">30-Day Overview</h2>
          <div class="chart-legend">
            <span class="legend-item legend-item--visitors">
              <span class="legend-dot"></span>Visitors
            </span>
            <span class="legend-item legend-item--revenue">
              <span class="legend-dot"></span>Revenue ($)
            </span>
          </div>
          <div class="chart-container" id="chart-container">
            <canvas id="timeseries-chart" aria-label="30-day visitors and revenue line chart"></canvas>
          </div>
        </section>

        <!-- Category breakdown -->
        <section class="panel panel--categories" aria-label="Category breakdown">
          <h2 class="panel__title">Category Breakdown</h2>
          <div class="categories-list" id="categories-list">
            <!-- Populated by JS -->
          </div>
        </section>
      </div>

      <!-- ── Recent Items Table ─────────────────────────────────────── -->
      <section class="panel panel--table" aria-label="Recent items">
        <h2 class="panel__title">Recent Items</h2>
        <div class="table-wrapper">
          <table class="data-table" id="recent-table">
            <thead>
              <tr>
                <th scope="col">Name</th>
                <th scope="col">Category</th>
                <th scope="col" class="col-value">Value</th>
                <th scope="col" class="col-date">Date</th>
              </tr>
            </thead>
            <tbody id="recent-tbody">
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
