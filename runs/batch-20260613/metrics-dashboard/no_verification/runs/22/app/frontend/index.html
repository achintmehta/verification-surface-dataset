<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metrics Dashboard</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="header-title">Metrics Dashboard</h1>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <span class="theme-icon" id="theme-icon">☀️</span>
      </button>
    </header>

    <main class="dashboard">
      <!-- Error state -->
      <div id="error-state" class="error-state" style="display: none;">
        <div class="error-card">
          <h2>Unable to load dashboard data</h2>
          <p>The backend server is not responding. Please ensure the server is running and try again.</p>
          <button id="retry-btn" class="retry-btn">Retry</button>
        </div>
      </div>

      <!-- Loading state -->
      <div id="loading-state" class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading dashboard...</p>
      </div>

      <!-- Dashboard content -->
      <div id="dashboard-content" style="display: none;">
        <!-- Stat cards -->
        <section class="stat-cards" id="stat-cards">
          <div class="stat-card" id="card-visitors">
            <span class="stat-label">Total Visitors</span>
            <span class="stat-value" id="stat-visitors">—</span>
          </div>
          <div class="stat-card" id="card-revenue">
            <span class="stat-label">Total Revenue</span>
            <span class="stat-value" id="stat-revenue">—</span>
          </div>
          <div class="stat-card" id="card-best-day">
            <span class="stat-label">Best Day</span>
            <span class="stat-value" id="stat-best-day">—</span>
            <span class="stat-sub" id="stat-best-day-date"></span>
          </div>
          <div class="stat-card" id="card-trend">
            <span class="stat-label">7-Day Trend</span>
            <span class="stat-value" id="stat-trend">—</span>
            <span class="stat-sub trend-indicator" id="trend-indicator"></span>
          </div>
        </section>

        <!-- Chart + Categories row -->
        <section class="body-grid">
          <div class="card chart-card" id="chart-card">
            <h2 class="card-title">Visitors (30 Days)</h2>
            <div class="chart-container" id="chart-container">
              <svg id="timeseries-chart" width="100%" height="100%"></svg>
            </div>
          </div>
          <div class="card categories-card" id="categories-card">
            <h2 class="card-title">Categories</h2>
            <div class="categories-list" id="categories-list"></div>
          </div>
        </section>

        <!-- Recent items table -->
        <section class="card table-card">
          <h2 class="card-title">Recent Items</h2>
          <div class="table-wrapper">
            <table class="data-table" id="recent-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Category</th>
                  <th>Value</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="recent-tbody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
