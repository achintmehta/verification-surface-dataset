<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metrics Dashboard</title>
  <script type="module" crossorigin src="/assets/index-B4AmYoGi.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CXYsk1WO.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Metrics Dashboard</h1>
      <button id="theme-toggle">Toggle Theme</button>
    </header>

    <div class="dashboard">
      <!-- Stat Cards -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Visitors</div>
          <div class="stat-value" id="total-visitors">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Revenue</div>
          <div class="stat-value" id="total-revenue">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Best Day Revenue</div>
          <div class="stat-value" id="best-day">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">7-Day Trend</div>
          <div class="stat-value" id="trend">
            <span id="trend-value">-</span>
            <span id="trend-indicator"></span>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="main-grid">
        <!-- Time Series Chart -->
        <div class="card chart-card">
          <h2>30-Day Visitors Trend</h2>
          <div id="chart-container">
            <svg id="timeseries-chart" width="100%" height="300"></svg>
          </div>
        </div>

        <!-- Category Breakdown -->
        <div class="card category-card">
          <h2>Category Breakdown</h2>
          <div id="category-list"></div>
        </div>
      </div>

      <!-- Recent Items Table -->
      <div class="card table-card">
        <h2>Recent Items</h2>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Value</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="recent-table"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
