<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metrics Dashboard</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-header__inner">
        <h1 class="app-header__title">Analytics</h1>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">
          <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
          <span class="theme-toggle__label">Dark</span>
        </button>
      </div>
    </header>

    <main id="app" class="app">
      <div id="error-banner" class="error-banner" hidden role="alert"></div>

      <section class="stat-grid" id="stat-grid" aria-label="Summary statistics">
        <!-- stat cards injected here -->
      </section>

      <section class="body-grid" id="body-grid">
        <article class="card card--chart">
          <h2 class="card__title">Visitors — last 30 days</h2>
          <div class="chart" id="chart" aria-label="Time series chart of daily visitors">
            <!-- svg injected here -->
          </div>
        </article>

        <article class="card card--breakdown">
          <h2 class="card__title">Traffic by source</h2>
          <div class="breakdown" id="breakdown">
            <!-- bars injected here -->
          </div>
        </article>

        <article class="card card--table">
          <h2 class="card__title">Recent activity</h2>
          <div class="table-wrap" id="table-wrap">
            <!-- table injected here -->
          </div>
        </article>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
