<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metrics Dashboard</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Prevent flash of unstyled content or wrong theme */
    body { opacity: 0; transition: opacity 0.2s; }
    body.ready { opacity: 1; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Metrics Dashboard</h1>
      <button id="theme-toggle">Toggle Theme</button>
    </header>
    
    <div id="error-state" class="hidden">
      <h2>Error loading dashboard</h2>
      <p>Could not connect to the API. Please ensure the backend is running.</p>
    </div>

    <main id="dashboard" class="hidden">
      <section class="stat-cards">
        <div class="card">
          <h3>Total Visitors</h3>
          <p id="stat-visitors" class="stat-value">--</p>
        </div>
        <div class="card">
          <h3>Total Revenue</h3>
          <p id="stat-revenue" class="stat-value">--</p>
        </div>
        <div class="card">
          <h3>Best Day</h3>
          <p id="stat-best-day" class="stat-value">--</p>
        </div>
        <div class="card">
          <h3>7-Day Trend</h3>
          <p id="stat-trend" class="stat-value">--</p>
        </div>
      </section>

      <div class="main-content">
        <section class="chart-section card">
          <h3>Revenue (30 Days)</h3>
          <div class="chart-container">
            <canvas id="timeseries-chart"></canvas>
          </div>
        </section>

        <section class="breakdown-section card">
          <h3>Category Breakdown</h3>
          <div id="category-bars"></div>
        </section>
      </div>

      <section class="table-section card">
        <h3>Recent Items</h3>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Value</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="recent-tbody">
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
