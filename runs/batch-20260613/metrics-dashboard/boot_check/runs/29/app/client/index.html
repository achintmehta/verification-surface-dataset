<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metrics Dashboard</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Metrics Dashboard</h1>
      <button id="theme-toggle">Toggle Theme</button>
    </header>
    
    <div id="error-banner" style="display: none;"></div>
    
    <div class="dashboard">
      <!-- Stat Cards -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Visitors</div>
          <div class="stat-value" id="total-visitors">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Revenue</div>
          <div class="stat-value" id="total-revenue">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Best Day</div>
          <div class="stat-value" id="best-day">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">7-Day Trend</div>
          <div class="stat-value" id="trend">-</div>
        </div>
      </div>

      <!-- Charts and Breakdown -->
      <div class="main-grid">
        <div class="card chart-card">
          <h2>30-Day Visitors Trend</h2>
          <div id="timeseries-container">
            <canvas id="timeseries-chart" width="600" height="300"></canvas>
          </div>
        </div>
        
        <div class="card breakdown-card">
          <h2>Category Breakdown</h2>
          <div id="categories-container"></div>
        </div>
      </div>

      <!-- Recent Items Table -->
      <div class="card table-card">
        <h2>Recent Items</h2>
        <div class="table-container">
          <table id="recent-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Value</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="recent-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
