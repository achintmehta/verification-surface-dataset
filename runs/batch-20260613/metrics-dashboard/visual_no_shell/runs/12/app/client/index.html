<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metrics Dashboard</title>
    <script>
      // Apply a previously known theme as early as possible to reduce flash.
      // The authoritative value still comes from the server on load.
      try {
        var t = document.cookie.match(/(?:^|; )theme=(light|dark)/);
        if (t) document.documentElement.setAttribute('data-theme', t[1]);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
