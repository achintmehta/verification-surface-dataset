<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Final Responsive Verification</title>
  <style>
    body { margin: 0; padding: 10px; background: #222; font-family: sans-serif; }
    h3 { color: #aaa; margin: 8px 0 4px; font-size: 12px; }
    .row { display: flex; gap: 10px; margin-bottom: 10px; }
    iframe { border: 1px solid #555; display: block; }
  </style>
  <script>
    // Ensure light mode for this test
    fetch('/api/settings', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ theme: 'light' })
    }).then(() => {
      document.querySelectorAll('iframe').forEach(f => {
        f.src = '/?t=' + Date.now();
      });
    });
  </script>
</head>
<body>
  <div class="row">
    <div>
      <h3>360px</h3>
      <iframe width="360" height="550" src="about:blank"></iframe>
    </div>
    <div>
      <h3>768px</h3>
      <iframe width="768" height="550" src="about:blank"></iframe>
    </div>
  </div>
  <div>
    <h3>1280px</h3>
    <iframe width="1280" height="550" src="about:blank"></iframe>
  </div>
</body>
</html>
