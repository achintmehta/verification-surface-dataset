<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dark Preview</title>
    <style>
      body { margin: 0; background: #000; }
      iframe { border: 0; display: block; }
    </style>
  </head>
  <body>
    <iframe id="f" width="1280" height="900"></iframe>
    <script>
      // Force theme to dark server-side, then load the dashboard.
      fetch('/api/settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ theme: 'dark' }),
      }).then(function () {
        document.getElementById('f').src = '/';
      });
    </script>
  </body>
</html>
