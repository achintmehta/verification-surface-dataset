<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metrics Dashboard</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="header-title">Metrics Dashboard</h1>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <span class="theme-icon" id="theme-icon">☀️</span>
      </button>
    </header>
    <main class="dashboard" id="dashboard">
      <div class="loading" id="loading-state">Loading dashboard data…</div>
      <div class="error-state" id="error-state" style="display:none;">
        <p>⚠️ Unable to load dashboard data. Please ensure the backend server is running.</p>
      </div>
      <div id="dashboard-content" style="display:none;">
        <!-- Stat Cards -->
        <section class="stat-cards" id="stat-cards">
          <div class="stat-card" id="card-visitors">
            <div class="stat-label">Total Visitors</div>
            <div class="stat-value" id="stat-visitors">—</div>
            <div class="stat-sub" id="stat-visitors-sub"></div>
          </div>
          <div class="stat-card" id="card-revenue">
            <div class="stat-label">Total Revenue</div>
            <div class="stat-value" id="stat-revenue">—</div>
            <div class="stat-sub" id="stat-revenue-sub"></div>
          </div>
          <div class="stat-card" id="card-bestday">
            <div class="stat-label">Best Day Revenue</div>
            <div class="stat-value" id="stat-bestday">—</div>
            <div class="stat-sub" id="stat-bestday-sub"></div>
          </div>
          <div class="stat-card" id="card-trend">
            <div class="stat-label">7-Day Trend</div>
            <div class="stat-value" id="stat-trend">—</div>
            <div class="stat-sub" id="stat-trend-sub">vs previous 7 days</div>
          </div>
        </section>

        <!-- Charts Row -->
        <section class="charts-row">
          <div class="chart-container card" id="timeseries-container">
            <h2 class="card-title">Daily Revenue (30 Days)</h2>
            <div class="chart-wrapper" id="timeseries-wrapper">
              <svg id="timeseries-chart" width="100%" height="300"></svg>
            </div>
          </div>
          <div class="chart-container card" id="categories-container">
            <h2 class="card-title">Category Breakdown</h2>
            <div class="categories-list" id="categories-list"></div>
          </div>
        </section>

        <!-- Recent Items Table -->
        <section class="table-section card">
          <h2 class="card-title">Recent Items</h2>
          <div class="table-wrapper">
            <table class="data-table" id="recent-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Category</th>
                  <th>Value</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="recent-tbody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
