<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=768, initial-scale=1.0" />
  <title>768px Viewport Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #eee; }
    .wrapper {
      width: 768px;
      overflow: hidden;
      border: 2px solid #333;
      margin: 0;
    }
    iframe {
      width: 768px;
      height: 2400px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <iframe src="/" width="768" scrolling="yes"></iframe>
  </div>
</body>
</html>
