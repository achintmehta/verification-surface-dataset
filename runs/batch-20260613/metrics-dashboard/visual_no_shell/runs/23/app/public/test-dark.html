<!DOCTYPE html>
<html>
<head><title>Set Dark Theme</title></head>
<body>
<script>
fetch('/api/settings', {
  method: 'PUT',
  headers: {'Content-Type': 'application/json'},
  body: JSON.stringify({theme: 'dark'})
}).then(r => r.json()).then(() => {
  window.location.href = '/';
});
</script>
<p>Setting dark theme...</p>
</body>
</html>
