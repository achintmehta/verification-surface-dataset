<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metrics Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="header-title"><span class="header-logo" aria-hidden="true"></span> Metrics Dashboard</h1>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <span class="theme-icon" id="theme-icon-text">Dark</span>
      </button>
    </header>

    <main class="dashboard">
      <div id="error-banner" class="error-banner hidden">
        <span>⚠️ Unable to load data from the server. Please ensure the backend is running.</span>
      </div>

      <section class="stat-cards" id="stat-cards">
        <div class="card stat-card" id="card-visitors">
          <div class="stat-label">Total Visitors</div>
          <div class="stat-value" id="stat-visitors">—</div>
          <div class="stat-sub" id="stat-visitors-sub"></div>
        </div>
        <div class="card stat-card" id="card-revenue">
          <div class="stat-label">Total Revenue</div>
          <div class="stat-value" id="stat-revenue">—</div>
          <div class="stat-sub" id="stat-revenue-sub"></div>
        </div>
        <div class="card stat-card" id="card-bestday">
          <div class="stat-label">Best Day</div>
          <div class="stat-value" id="stat-bestday">—</div>
          <div class="stat-sub" id="stat-bestday-sub"></div>
        </div>
        <div class="card stat-card" id="card-trend">
          <div class="stat-label">7-Day Trend</div>
          <div class="stat-value" id="stat-trend">—</div>
          <div class="stat-sub" id="stat-trend-sub">vs previous 7 days</div>
        </div>
      </section>

      <section class="body-grid">
        <div class="card chart-card" id="chart-card">
          <h2 class="card-title">Daily Visitors (30 Days)</h2>
          <div class="chart-container" id="chart-container">
            <svg id="timeseries-chart" width="100%" height="100%"></svg>
          </div>
        </div>

        <div class="card categories-card" id="categories-card">
          <h2 class="card-title">Category Breakdown</h2>
          <div class="categories-list" id="categories-list"></div>
        </div>
      </section>

      <section class="card table-card">
        <h2 class="card-title">Recent Items</h2>
        <div class="table-wrapper">
          <table class="data-table" id="recent-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Value</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="recent-tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
