<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metrics Dashboard</title>
  <link rel="stylesheet" href="/src/style.css" />
  <!-- Apply persisted theme synchronously to prevent flash of wrong theme.
       We read from localStorage as a fast fallback; the JS module will
       then fetch the server value and correct it if needed. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-inner">
        <div class="header-brand">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
          <span class="brand-name">Metrics Dashboard</span>
        </div>
        <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
          <span class="theme-icon theme-icon--light">☀️</span>
          <span class="theme-icon theme-icon--dark">🌙</span>
          <span class="theme-label" id="theme-label">Light</span>
        </button>
      </div>
    </header>

    <main class="main">
      <div id="error-banner" class="error-banner" hidden>
        <strong>⚠ Unable to reach the API.</strong>
        The dashboard cannot load data while the backend is offline.
      </div>

      <!-- Stat cards -->
      <section class="section" aria-label="Summary statistics">
        <div class="stat-grid" id="stat-grid">
          <div class="stat-card skeleton" id="card-visitors">
            <div class="stat-label">Total Visitors</div>
            <div class="stat-value" id="val-visitors">—</div>
            <div class="stat-trend" id="trend-visitors"></div>
          </div>
          <div class="stat-card skeleton" id="card-revenue">
            <div class="stat-label">Total Revenue</div>
            <div class="stat-value" id="val-revenue">—</div>
            <div class="stat-trend" id="trend-revenue"></div>
          </div>
          <div class="stat-card skeleton" id="card-best-day">
            <div class="stat-label">Best Day (Visitors)</div>
            <div class="stat-value" id="val-best-day">—</div>
            <div class="stat-trend" id="trend-best-day"></div>
          </div>
          <div class="stat-card skeleton" id="card-trend">
            <div class="stat-label">7-Day Trend</div>
            <div class="stat-value" id="val-trend">—</div>
            <div class="stat-trend" id="trend-detail"></div>
          </div>
        </div>
      </section>

      <!-- Charts row -->
      <section class="section charts-section" aria-label="Charts">
        <div class="charts-grid">
          <!-- Time-series chart -->
          <div class="chart-card" id="timeseries-card">
            <div class="chart-header">
              <h2 class="chart-title">30-Day Visitors</h2>
              <div class="chart-legend">
                <span class="legend-dot legend-dot--visitors"></span>
                <span class="legend-text">Daily Visitors</span>
              </div>
            </div>
            <div class="chart-body" id="timeseries-container">
              <svg id="timeseries-svg" class="chart-svg" aria-label="30-day visitors time series chart"></svg>
            </div>
          </div>

          <!-- Category breakdown -->
          <div class="chart-card" id="categories-card">
            <div class="chart-header">
              <h2 class="chart-title">Category Breakdown</h2>
            </div>
            <div class="chart-body" id="categories-container">
              <div id="categories-bars" class="category-bars"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Recent items table -->
      <section class="section" aria-label="Recent items">
        <div class="table-card">
          <div class="chart-header">
            <h2 class="chart-title">Recent Items</h2>
          </div>
          <div class="table-wrapper">
            <table class="data-table" id="recent-table">
              <thead>
                <tr>
                  <th scope="col">Name</th>
                  <th scope="col">Category</th>
                  <th scope="col" class="col-right">Value</th>
                  <th scope="col" class="col-right">Date</th>
                </tr>
              </thead>
              <tbody id="recent-tbody">
                <tr><td colspan="4" class="table-loading">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
