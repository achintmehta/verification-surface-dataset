<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Responsive Test</title>
  <style>
    body { margin: 0; background: #333; font-family: sans-serif; }
    .frame-wrap { margin: 20px auto; }
    .label { color: #fff; font-size: 14px; padding: 8px 12px; background: #555; }
    iframe { display: block; border: none; background: #fff; }
  </style>
</head>
<body>
  <div class="frame-wrap">
    <div class="label">📱 360px — Mobile</div>
    <iframe src="/" width="360" height="900" style="width:360px"></iframe>
  </div>
  <div class="frame-wrap">
    <div class="label">📟 768px — Tablet</div>
    <iframe src="/" width="768" height="900" style="width:768px"></iframe>
  </div>
  <div class="frame-wrap">
    <div class="label">🖥 1280px — Desktop</div>
    <iframe src="/" width="1280" height="900" style="width:1280px"></iframe>
  </div>
</body>
</html>
