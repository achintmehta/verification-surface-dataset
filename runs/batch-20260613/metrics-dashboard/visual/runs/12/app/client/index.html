<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metrics Dashboard</title>
    <script>
      // Apply a sensible theme before first paint to avoid a flash; the persisted
      // server value is fetched and re-applied by main.js shortly after.
      (function () {
        try {
          var cached = localStorage.getItem('theme');
          if (cached === 'light' || cached === 'dark') {
            document.documentElement.setAttribute('data-theme', cached);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-header__inner">
        <h1 class="app-title">Metrics Dashboard</h1>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">
          <span class="theme-toggle__icon" aria-hidden="true"></span>
          <span class="theme-toggle__label">Theme</span>
        </button>
      </div>
    </header>

    <main class="dashboard" id="dashboard">
      <div id="error-banner" class="error-banner" hidden role="alert"></div>

      <section class="stat-grid" id="stat-grid" aria-label="Summary statistics"></section>

      <section class="body-grid">
        <article class="card chart-card">
          <h2 class="card__title">Revenue — last 30 days</h2>
          <div class="chart-container" id="chart-container">
            <svg id="chart" class="chart" role="img" aria-label="Revenue time series chart"></svg>
          </div>
        </article>

        <article class="card breakdown-card">
          <h2 class="card__title">Revenue by category</h2>
          <div class="breakdown" id="breakdown"></div>
        </article>

        <article class="card table-card">
          <h2 class="card__title">Recent items</h2>
          <div class="table-wrap">
            <table class="data-table" id="recent-table">
              <thead>
                <tr>
                  <th scope="col">Name</th>
                  <th scope="col">Category</th>
                  <th scope="col" class="num">Value</th>
                  <th scope="col">Created</th>
                </tr>
              </thead>
              <tbody id="recent-body"></tbody>
            </table>
          </div>
        </article>
      </section>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
