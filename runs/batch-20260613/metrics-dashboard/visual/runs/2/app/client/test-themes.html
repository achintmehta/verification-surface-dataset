<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Theme Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; font-family: sans-serif; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; gap: 12px; }
    .panel { flex: 1; border-radius: 8px; overflow: hidden; }
    .label { background: #222; color: #aaa; padding: 6px 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    iframe { border: none; display: block; width: 100%; }
  </style>
</head>
<body>
  <div class="row">
    <div class="panel">
      <div class="label">Light Theme — 1280px</div>
      <div style="height:600px; overflow:hidden;">
        <iframe id="light" src="http://localhost:5173" style="width:1280px; height:1200px; transform-origin:top left; transform:scale(0.72);"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
