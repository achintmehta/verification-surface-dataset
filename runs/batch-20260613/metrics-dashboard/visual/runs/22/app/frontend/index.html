<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metrics Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="header__title">📊 Metrics Dashboard</h1>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light theme">
        <span class="theme-toggle__icon">🌙</span>
      </button>
    </header>

    <main class="dashboard">
      <!-- Error state -->
      <div id="error-state" class="error-state" style="display:none;">
        <div class="error-state__icon">⚠️</div>
        <h2>Unable to load dashboard data</h2>
        <p>The server may be unavailable. Please try again later.</p>
      </div>

      <!-- Loading state -->
      <div id="loading-state" class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading dashboard...</p>
      </div>

      <!-- Dashboard content -->
      <div id="dashboard-content" style="display:none;">
        <!-- Stat Cards -->
        <section class="stat-cards" aria-label="Summary statistics">
          <div class="stat-card" id="card-visitors">
            <div class="stat-card__label">Total Visitors</div>
            <div class="stat-card__value" id="stat-visitors">—</div>
          </div>
          <div class="stat-card" id="card-revenue">
            <div class="stat-card__label">Total Revenue</div>
            <div class="stat-card__value" id="stat-revenue">—</div>
          </div>
          <div class="stat-card" id="card-bestday">
            <div class="stat-card__label">Best Day</div>
            <div class="stat-card__value" id="stat-bestday">—</div>
            <div class="stat-card__sub" id="stat-bestday-sub"></div>
          </div>
          <div class="stat-card" id="card-trend">
            <div class="stat-card__label">7-Day Trend</div>
            <div class="stat-card__value" id="stat-trend">—</div>
            <div class="stat-card__indicator" id="stat-trend-indicator"></div>
          </div>
        </section>

        <!-- Charts row -->
        <section class="charts-row">
          <div class="chart-panel chart-panel--timeseries">
            <h2 class="panel-title">Daily Visitors (30 Days)</h2>
            <div class="chart-container" id="timeseries-container">
              <canvas id="timeseries-chart"></canvas>
            </div>
          </div>
          <div class="chart-panel chart-panel--categories">
            <h2 class="panel-title">Category Breakdown</h2>
            <div class="categories-container" id="categories-container">
              <!-- Bars injected by JS -->
            </div>
          </div>
        </section>

        <!-- Recent items table -->
        <section class="table-panel">
          <h2 class="panel-title">Recent Items</h2>
          <div class="table-scroll">
            <table class="data-table" id="recent-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Category</th>
                  <th class="numeric">Value</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="recent-tbody">
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
