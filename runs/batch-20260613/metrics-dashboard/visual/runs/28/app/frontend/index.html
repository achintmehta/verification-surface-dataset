<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metrics Dashboard</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Metrics Dashboard</h1>
      <div class="header-actions">
        <button id="theme-toggle" class="theme-toggle">🌓 Toggle Theme</button>
      </div>
    </header>

    <div id="error-banner" class="error-banner hidden"></div>

    <!-- Stat Cards -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Visitors</div>
        <div id="total-visitors" class="stat-value">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Revenue</div>
        <div id="total-revenue" class="stat-value">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Best Day</div>
        <div id="best-day" class="stat-value">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">7-Day Trend</div>
        <div id="seven-day-trend" class="stat-value">-</div>
      </div>
    </div>

    <!-- Main Content: Chart and Breakdown -->
    <div class="main-grid">
      <div class="card">
        <h2>30-Day Time Series</h2>
        <div id="timeseries-container" class="chart-container">
          <svg id="timeseries-chart" width="100%" height="300"></svg>
        </div>
      </div>
      <div class="card">
        <h2>Category Breakdown</h2>
        <div id="categories-container" class="categories-container"></div>
      </div>
    </div>

    <!-- Recent Items Table -->
    <div class="card">
      <h2>Recent Items</h2>
      <div class="table-container">
        <table id="recent-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Category</th>
              <th>Value</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
