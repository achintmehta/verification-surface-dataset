<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PGLite Realtime Message Board</title>
  </head>
  <body>
    <main class="app-shell">
      <header>
        <p class="eyebrow">PGLite + SSE</p>
        <h1>Realtime Message Board</h1>
        <p class="subtitle">Post a short note and every connected browser sees it instantly.</p>
      </header>

      <section class="composer" aria-label="Post a message">
        <form id="message-form">
          <label for="message-input">Message</label>
          <div class="form-row">
            <input
              id="message-input"
              name="text"
              type="text"
              maxlength="1000"
              placeholder="Write something..."
              autocomplete="off"
              required
            />
            <button type="submit">Post</button>
          </div>
          <p id="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="feed" aria-label="Messages">
        <div class="feed-header">
          <h2>Messages</h2>
          <span id="connection-status" class="status status-connecting">Connecting...</span>
        </div>
        <ul id="messages" class="message-list"></ul>
        <p id="empty-state" class="empty-state">No messages yet. Be the first to post!</p>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
