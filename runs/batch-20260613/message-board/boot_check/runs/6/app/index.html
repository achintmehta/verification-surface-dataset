<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PGLite Realtime Message Board</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">PGLite + Server-Sent Events</p>
        <h1>Realtime Message Board</h1>
        <p class="subtitle">Post a message and every connected browser will see it instantly.</p>
      </header>

      <section class="composer" aria-label="Post a message">
        <form id="message-form">
          <label for="message-input" class="visually-hidden">Message text</label>
          <input
            id="message-input"
            name="text"
            type="text"
            maxlength="1000"
            autocomplete="off"
            placeholder="Write a message..."
            required
          />
          <button type="submit">Post</button>
        </form>
        <p id="status" role="status" aria-live="polite">Connecting...</p>
      </section>

      <section class="feed" aria-label="Messages">
        <ol id="message-list" class="message-list"></ol>
        <p id="empty-state" class="empty-state">No messages yet. Be the first to post one.</p>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
