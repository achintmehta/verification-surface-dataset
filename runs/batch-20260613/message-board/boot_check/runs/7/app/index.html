<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PGLite Realtime Message Board</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="board-card" aria-labelledby="board-title">
        <header class="board-header">
          <div>
            <p class="eyebrow">PGLite + SSE</p>
            <h1 id="board-title">Realtime Message Board</h1>
          </div>
          <div id="connectionStatus" class="status status--connecting" role="status" aria-live="polite">
            Connecting
          </div>
        </header>

        <ul id="messageList" class="message-list" aria-live="polite" aria-label="Messages"></ul>

        <p id="emptyState" class="empty-state">No messages yet. Be the first to post one.</p>

        <form id="messageForm" class="message-form" autocomplete="off">
          <label class="sr-only" for="messageInput">Message text</label>
          <input
            id="messageInput"
            name="text"
            type="text"
            maxlength="1000"
            placeholder="Write a message..."
            required
          />
          <button type="submit">Post</button>
        </form>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
