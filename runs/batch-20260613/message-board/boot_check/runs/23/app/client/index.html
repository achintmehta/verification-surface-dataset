<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Board</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: #f4f4f8;
        color: #1a1a2e;
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
        min-height: 100vh;
      }

      #app {
        width: 100%;
        max-width: 640px;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      h1 {
        text-align: center;
        font-size: 1.6rem;
      }

      #status {
        text-align: center;
        font-size: 0.85rem;
        color: #888;
      }
      #status.connected {
        color: #2ecc71;
      }
      #status.error {
        color: #e74c3c;
      }

      #messages {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        flex: 1;
        overflow-y: auto;
        max-height: 60vh;
        padding: 0.5rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fff;
      }

      #messages li {
        background: #eef1ff;
        padding: 0.6rem 0.8rem;
        border-radius: 6px;
        word-wrap: break-word;
      }

      #messages li .meta {
        display: block;
        font-size: 0.7rem;
        color: #999;
        margin-top: 0.25rem;
      }

      form {
        display: flex;
        gap: 0.5rem;
      }

      form input[type="text"] {
        flex: 1;
        padding: 0.6rem 0.8rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s;
      }

      form input[type="text"]:focus {
        border-color: #5b6abf;
      }

      form button {
        padding: 0.6rem 1.2rem;
        background: #5b6abf;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s;
      }

      form button:hover {
        background: #4a58a5;
      }

      form button:disabled {
        background: #aaa;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>📋 Message Board</h1>
      <p id="status">Connecting…</p>
      <ul id="messages"></ul>
      <form id="form">
        <input
          type="text"
          id="input"
          placeholder="Type a message…"
          autocomplete="off"
          required
        />
        <button type="submit">Send</button>
      </form>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
