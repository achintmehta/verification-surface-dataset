<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Board</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app">
      <!-- ── Header ─────────────────────────────────────────────────── -->
      <header class="app-header">
        <h1>📋 Message Board</h1>
        <span id="status-indicator" class="status status--connecting" title="SSE connection status">
          ● Connecting…
        </span>
      </header>

      <!-- ── Message feed ───────────────────────────────────────────── -->
      <main class="feed-container">
        <ul id="message-list" class="message-list" aria-live="polite" aria-label="Messages">
          <!-- Messages are injected here by main.js -->
        </ul>
        <p id="empty-state" class="empty-state" hidden>
          No messages yet. Be the first to say something!
        </p>
      </main>

      <!-- ── Compose form ───────────────────────────────────────────── -->
      <footer class="compose-area">
        <form id="compose-form" class="compose-form" autocomplete="off">
          <label for="message-input" class="sr-only">Write a message</label>
          <input
            id="message-input"
            class="compose-input"
            type="text"
            placeholder="Write a message…"
            maxlength="2000"
            required
            aria-label="Message text"
          />
          <button type="submit" class="compose-btn" aria-label="Send message">
            Send ➤
          </button>
        </form>
        <p id="compose-error" class="compose-error" hidden></p>
      </footer>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
