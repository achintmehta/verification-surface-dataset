<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Message Board</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>💬 Realtime Board</h1>
        <div class="status" id="status" data-state="connecting">
          <span class="status-dot"></span>
          <span class="status-text">Connecting…</span>
        </div>
      </header>

      <main>
        <ul id="messages" class="messages" aria-live="polite"></ul>
        <p id="empty" class="empty" hidden>No messages yet. Be the first to post!</p>
      </main>

      <form id="composer" class="composer" autocomplete="off">
        <input
          id="text"
          name="text"
          type="text"
          placeholder="Write a message…"
          maxlength="2000"
          required
          aria-label="Message text"
        />
        <button type="submit" id="send">Send</button>
      </form>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
