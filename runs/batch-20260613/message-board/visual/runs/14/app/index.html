<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Message Board</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>💬 Realtime Board</h1>
        <span id="status" class="status status--connecting">connecting…</span>
      </header>

      <main>
        <ul id="messages" class="messages"></ul>
        <p id="empty" class="empty">No messages yet. Be the first to post!</p>
      </main>

      <form id="composer" class="composer" autocomplete="off">
        <input
          id="text"
          name="text"
          class="composer__input"
          type="text"
          placeholder="Type a message and press Enter…"
          maxlength="1000"
          required
        />
        <button class="composer__button" type="submit">Send</button>
      </form>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
