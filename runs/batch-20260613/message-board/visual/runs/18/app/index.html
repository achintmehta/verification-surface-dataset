<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Board</title>
    <style>
      body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
      #messages { border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: auto; margin-bottom: 10px; }
      .message { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
      .message:last-child { border-bottom: none; }
      .time { font-size: 0.8em; color: #888; }
      form { display: flex; gap: 10px; }
      input { flex: 1; padding: 5px; }
      button { padding: 5px 10px; }
    </style>
  </head>
  <body>
    <h1>Message Board</h1>
    <div id="messages"></div>
    <form id="message-form">
      <input type="text" id="message-input" placeholder="Type a message..." required />
      <button type="submit">Send</button>
    </form>
    <script type="module" src="/main.js"></script>
  </body>
</html>
