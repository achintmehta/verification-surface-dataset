<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realtime Message Board</title>
  </head>
  <body>
    <div id="app">
      <header class="board-header">
        <h1>💬 Realtime Board</h1>
        <span id="status" class="status status--connecting">connecting…</span>
      </header>

      <main class="board-main">
        <ul id="messages" class="messages" aria-live="polite">
          <li class="empty" id="empty-state">No messages yet. Say hello! 👋</li>
        </ul>
      </main>

      <form id="message-form" class="message-form" autocomplete="off">
        <input
          id="message-input"
          class="message-input"
          type="text"
          name="text"
          placeholder="Type a message…"
          maxlength="2000"
          required
        />
        <button id="send-button" class="send-button" type="submit">Send</button>
      </form>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
