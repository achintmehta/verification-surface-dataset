<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PGLite Realtime Message Board</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">PGLite + Server-Sent Events</p>
        <h1>Realtime Message Board</h1>
        <p class="subtitle">Post a short message and it appears instantly for every connected client.</p>
      </header>

      <section class="composer" aria-labelledby="composer-title">
        <h2 id="composer-title">New message</h2>
        <form id="message-form">
          <label class="sr-only" for="message-input">Message text</label>
          <textarea
            id="message-input"
            name="text"
            rows="3"
            maxlength="1000"
            placeholder="Write something friendly…"
            required
          ></textarea>
          <div class="form-footer">
            <span id="status" role="status" aria-live="polite">Connecting…</span>
            <button type="submit">Post message</button>
          </div>
        </form>
      </section>

      <section class="feed" aria-labelledby="feed-title">
        <div class="feed-header">
          <h2 id="feed-title">Messages</h2>
          <span id="message-count">0 messages</span>
        </div>
        <ol id="messages" class="message-list" aria-live="polite"></ol>
        <p id="empty-state" class="empty-state">No messages yet. Be the first to post.</p>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
