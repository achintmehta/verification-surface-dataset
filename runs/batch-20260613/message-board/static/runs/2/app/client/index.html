<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Board</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1>📋 Message Board</h1>
        <span id="status-indicator" class="status status--connecting" title="Connection status">
          ● Connecting…
        </span>
      </header>

      <main class="app-main">
        <section class="message-feed" aria-label="Message feed">
          <ul id="message-list" class="message-list" aria-live="polite" aria-relevant="additions">
            <!-- Messages are injected here by JavaScript -->
          </ul>
          <p id="empty-state" class="empty-state">
            No messages yet. Be the first to say something!
          </p>
        </section>
      </main>

      <footer class="app-footer">
        <form id="message-form" class="message-form" novalidate>
          <label for="message-input" class="sr-only">New message</label>
          <input
            id="message-input"
            class="message-input"
            type="text"
            placeholder="Type a message and press Enter…"
            maxlength="2000"
            autocomplete="off"
            required
          />
          <button type="submit" class="send-button" aria-label="Send message">
            Send
          </button>
        </form>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
