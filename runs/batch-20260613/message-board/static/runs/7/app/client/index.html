<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PGLite Realtime Message Board</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">PGLite + Server-Sent Events</p>
        <h1 id="page-title">Realtime Message Board</h1>
        <p class="subtitle">Post a message and every connected browser receives it instantly.</p>
      </section>

      <section class="composer" aria-label="Post a new message">
        <form id="message-form" autocomplete="off">
          <label class="sr-only" for="message-input">Message text</label>
          <textarea id="message-input" name="text" maxlength="1000" rows="3" placeholder="Write a message..." required></textarea>
          <div class="form-actions">
            <span id="status" role="status" aria-live="polite">Connecting…</span>
            <button type="submit">Post message</button>
          </div>
        </form>
      </section>

      <section class="feed" aria-labelledby="feed-title">
        <div class="feed-header">
          <h2 id="feed-title">Messages</h2>
          <span id="message-count">0</span>
        </div>
        <ol id="messages" class="messages" aria-live="polite"></ol>
        <p id="empty-state" class="empty-state">No messages yet. Be the first to post one.</p>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
