<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Board</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1>📋 Message Board</h1>
        <span id="status" class="status status--connecting" title="SSE connection status">
          ● Connecting…
        </span>
      </header>

      <main class="board">
        <!-- Message feed -->
        <section class="feed" aria-label="Message feed" aria-live="polite">
          <ul id="message-list" class="message-list">
            <!-- Messages are injected here by JavaScript -->
          </ul>
          <p id="empty-state" class="empty-state" hidden>
            No messages yet. Be the first to say something!
          </p>
        </section>

        <!-- Post form -->
        <form id="post-form" class="post-form" novalidate>
          <label for="message-input" class="sr-only">New message</label>
          <textarea
            id="message-input"
            class="post-form__input"
            placeholder="Write a message…"
            rows="3"
            maxlength="2000"
            required
            autocomplete="off"
          ></textarea>
          <div class="post-form__footer">
            <span id="char-count" class="char-count">0 / 2000</span>
            <button type="submit" class="post-form__btn" id="submit-btn">
              Send
            </button>
          </div>
          <p id="form-error" class="form-error" hidden></p>
        </form>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
