<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Board</title>
  </head>
  <body>
    <div id="app">
      <h1>Message Board</h1>
      <div id="messages" style="border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px;"></div>
      <form id="message-form">
        <input type="text" id="message-input" placeholder="Type your message..." style="width: 80%; padding: 8px;" required />
        <button type="submit" style="padding: 8px;">Send</button>
      </form>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
